[workspace]
resolver = "2"
members = [
  "cli",
  "images/util",
  "puppet",
  "supervisor/connector/local",
  "supervisor/connector/ws",
  "supervisor/control-socket/tcp/client",
  "supervisor/control-socket/tcp/server",
  "supervisor/lib",
  "supervisor/nbd-netboot",
  "supervisor/qemu",
  "switchboard",
  "treadmill-rs",
]

# Test fixture built only by `nix/tiny-efi.nix` for a foreign target
# (aarch64-unknown-uefi). It carries its own Cargo.lock and an empty
# `[workspace]` table; excluding it here keeps cargo and crane from treating it
# as a workspace member.
exclude = ["nix/fixtures/tiny-efi"]

[workspace.package]
version = "0.1.0"
authors = ["Treadmill Project Developers <treadmill@tockos.org>"]
edition = "2024"

[workspace.metadata.crane]
name = "treadmill"

[workspace.dependencies]
# Internal crates (declared here so members can use `workspace = true` and
# don't have to repeat relative path strings).
treadmill-rs = { path = "treadmill-rs", version = "0.3.0" }
treadmill-supervisor-lib = { path = "supervisor/lib" }
treadmill-tcp-control-socket-client = { path = "supervisor/control-socket/tcp/client" }
treadmill-tcp-control-socket-server = { path = "supervisor/control-socket/tcp/server" }
treadmill-local-connector = { path = "supervisor/connector/local" }
treadmill-ws-connector = { path = "supervisor/connector/ws" }

# Shared third-party dependencies. Versions here are floors; per-member
# Cargo.toml selects features and may set `default-features = false`.
anyhow = "1.0.76"
async-nats = "0.50.0"
async-trait = "0.1.81"
base64 = "0.23.0"
bytes = "1.11.1"
# CEL, the expression language for job host predicates and image-set member
# refinements. Wrapped by `switchboard::predicate`; nothing else names it.
cel = "0.14.4"
chrono = "0.4.38"
clap = "4.5.24"
digest-io = "0.1.0"
# Ed25519 signing material for the job service gateway: seed to keypair, and
# the PKCS#8/SPKI encodings `jsonwebtoken` and the gateways consume.
ed25519-dalek = { version = "3.0.0", default-features = false }
futures = { version = "0.3.30", default-features = false }
futures-util = "0.3.30"
hex = "0.4.3"
http = "1.1.0"
humantime = "2.1.0"
humantime-serde = "1.1.1"
jsonwebtoken = { version = "11.0.0", default-features = false }
log = "0.4.22"
# NATS log streaming: client + JetStream (async-nats), and per-job bearer-JWT
# minting (nats-jwt signs claims, nkeys provides the Ed25519 account keypair).
nats-jwt = "0.3.0"
nkeys = "0.4.5"
oci-client = "0.17.0"
# Pinned to match the oci-spec that oci-client depends on, so the workspace
# resolves a single oci-spec version instead of two.
oci-spec = { version = "0.10.0", default-features = false, features = [
  "image",
] }
rand = "0.10"
reqwest = { version = "0.13", default-features = false }
schemars = "1"
serde = "1.0.204"
serde_json = "1.0.120"
serde_path_to_error = "0.1.20"
serde_with = "3.8.1"
sd-notify = "0.5.0"
sha2 = "0.11"
subtle = "2.6.1"
tempfile = "3"
thiserror = "2"
# tokio/tokio-util have no meaningful default features; declare false so
# members that want a minimal feature set (the supervisors, control-socket)
# don't need to repeat the override, and Cargo forbids per-member overrides
# anyway when `workspace = true`.
tokio = { version = "1.38.0", default-features = false }
tokio-stream = "0.1.14"
tokio-util = { version = "0.7.10", default-features = false }
toml = "1.1.2"
tracing = "0.1.40"
tracing-subscriber = "0.3.20"
uuid = "1.9.1"

[workspace.lints.clippy]
complexity = { level = "deny", priority = -1 }
type_complexity = "allow"
result_large_err = "allow"
too_many_arguments = "allow"
large_enum_variant = "allow"
from_str_radix_10 = "allow"

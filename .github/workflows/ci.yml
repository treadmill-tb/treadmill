name: treadmill-ci
env:
  TERM: xterm # Makes tput work in actions output

# Controls when the action will run. Triggers the workflow on push or pull
# request events but only for the master branch
on:
  # To avoid double-runs, we only run checks on main (or other long-term
  # branches potentially added in the future). To initiate checks to be
  # triggered for a branch, open a (draft) PR.
  push:
    branches: [main]
  # Run CI for PRs on any branch
  pull_request:
  # Run CI for the GitHub merge queue
  merge_group:

# Cancel superseded runs for the same PR. Never cancel merge_group or main runs.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  flake-check:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - uses: cachix/install-nix-action@v31
      - uses: cachix/cachix-action@v17
        with:
          name: treadmill-tb
          skipPush: true

      - run: nix flake check --print-build-logs

  ci-heavy:
    if: github.event_name != 'pull_request'

    runs-on: ubuntu-latest

    # On main or in the merge queue to main we have access to the "cachix-push"
    # environment secrets and can seed the cache.
    environment: ${{ ((github.event_name == 'push' && github.ref == 'refs/heads/main') || (github.event_name == 'merge_group' && github.event.merge_group.base_ref == 'refs/heads/main')) && 'cachix-push' || '' }}

    env:
      CACHIX_AUTH_TOKEN: ${{ secrets.CACHIX_AUTH_TOKEN }}

    steps:
      - uses: actions/checkout@v7

      - uses: cachix/install-nix-action@v31
      - uses: cachix/cachix-action@v17
        with:
          name: treadmill-tb
          skipPush: true

      - run: nix build --print-build-logs --no-link '.#ci-heavy'

      - name: Seed Cachix
        if: env.CACHIX_AUTH_TOKEN != ''
        run: |
          nix build --no-link --print-out-paths '.#cache-seed' \
            | cachix push treadmill-tb

  deploy-console:
    needs: [flake-check, ci-heavy]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    runs-on: ubuntu-latest

    environment:
      name: console-prod
      url: ${{ vars.TML_CONSOLE_URL }}

    permissions:
      contents: read
      deployments: write

    concurrency:
      group: deploy-console-prod
      cancel-in-progress: false

    steps:
      - uses: actions/checkout@v7

      - uses: cachix/install-nix-action@v31
      - uses: cachix/cachix-action@v17
        with:
          name: treadmill-tb
          skipPush: true

      - name: nix build console (production API origin)
        env:
          TML_CONSOLE_API_URL: ${{ vars.TML_CONSOLE_API_URL }}
        run: |
          if [ -z "$TML_CONSOLE_API_URL" ]; then
            echo "vars.TML_CONSOLE_API_URL must be set" >&2
            exit 1
          fi
          export TML_CONSOLE_REV="${GITHUB_SHA:0:7}"
          nix build --impure --print-build-logs --out-link console-result --expr '
            (builtins.getFlake (toString ./.))
              .packages.${builtins.currentSystem}.console
              .override {
                apiUrl = builtins.getEnv "TML_CONSOLE_API_URL";
                rev = builtins.getEnv "TML_CONSOLE_REV";
              }
          '

      - name: Resolve symlinks in console build
        run: cp -rL --no-preserve=mode console-result console-dist

      - uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          command: >-
            pages deploy console-dist
            --project-name=${{ vars.CF_PAGES_PROJECT }}
            --branch=main

      # Work around an issue hit on previous deploys: when an `/asset` is
      # updated but not fully propagated, that resulting 404 will be cached for
      # a long time, breaking the site on Cloudflare's Edge cache. Purge the
      # zone to avoid running into this issue:
      - name: Purge Cloudflare cache
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ZONE_ID: ${{ vars.CLOUDFLARE_ZONE_ID }}
        run: |
          if [ -z "$CLOUDFLARE_ZONE_ID" ]; then
            echo "vars.CLOUDFLARE_ZONE_ID must be set" >&2
            exit 1
          fi
          response="$(curl -sS --fail-with-body -X POST \
            "https://api.cloudflare.com/client/v4/zones/$CLOUDFLARE_ZONE_ID/purge_cache" \
            -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
            -H "Content-Type: application/json" \
            --data '{"purge_everything":true}')" || true
          if [ "$(printf '%s' "$response" | jq -r '.success // false')" != "true" ]; then
            echo "Cloudflare cache purge failed:" >&2
            printf '%s\n' "$response" >&2
            exit 1
          fi
          echo "Purged Cloudflare cache for zone $CLOUDFLARE_ZONE_ID"

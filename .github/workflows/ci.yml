name: treadmill-ci
env:
  TERM: xterm # Makes tput work in actions output

# Controls when the action will run. Triggers the workflow on push or pull
# request events but only for the master branch
on:
  # To avoid double-runs, we only run checks on main (or other long-term
  # branches potentially added in the future). To initiate checks to be
  # triggered for a branch, open a (draft) PR.
  push:
    branches: [main]
  # Run CI for PRs on any branch
  pull_request:
  # Run CI for the GitHub merge queue
  merge_group:

# Cancel superseded runs for the same PR. Never cancel merge_group or main runs.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  nix-flake-check:
    runs-on: ubuntu-latest

    # If building on main, we have access to the "cachix-push" environment
    # secrets and can push to the cache.
    environment: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' && 'cachix-push' || '' }}

    steps:
      - uses: actions/checkout@v4

      - uses: cachix/install-nix-action@v30
      - uses: cachix/cachix-action@v15
        with:
          name: treadmill-tb
          authToken: '${{ secrets.CACHIX_AUTH_TOKEN }}'
          skipPush: ${{ !(github.event_name == 'push' && github.ref == 'refs/heads/main') }}

      # On `pull_request`, only build a curated subset of checks to keep PR
      # feedback fast. The full `nix flake check` runs in `merge_group` (which
      # gates merging into main) and on `push` to main, so heavier builds
      # (musl cross-compile of tml-puppet, swx-image, per-binary package
      # derivations, etc.) still get exercised before anything lands.
      - name: nix build (PR fast checks)
        if: github.event_name == 'pull_request'
        run: |
          SYSTEM="$(nix eval --impure --raw --expr 'builtins.currentSystem')"
          nix build --print-build-logs \
            ".#checks.${SYSTEM}.clippy" \
            ".#checks.${SYSTEM}.nextest" \
            ".#checks.${SYSTEM}.switchboard-migrations-consistency" \
            ".#checks.${SYSTEM}.treefmt"

      - name: nix flake check (full)
        if: github.event_name != 'pull_request'
        run: nix flake check --print-build-logs

  deploy-console:
    needs: nix-flake-check
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    runs-on: ubuntu-latest

    environment:
      name: console-prod
      url: ${{ vars.TML_CONSOLE_URL }}

    permissions:
      contents: read
      deployments: write

    concurrency:
      group: deploy-console-prod
      cancel-in-progress: false

    steps:
      - uses: actions/checkout@v4

      - uses: cachix/install-nix-action@v30
      - uses: cachix/cachix-action@v15
        with:
          name: treadmill-tb
          skipPush: true

      - name: nix build console (production API origin)
        env:
          TML_CONSOLE_API_URL: ${{ vars.TML_CONSOLE_API_URL }}
        run: |
          if [ -z "$TML_CONSOLE_API_URL" ]; then
            echo "vars.TML_CONSOLE_API_URL must be set" >&2
            exit 1
          fi
          export TML_CONSOLE_REV="${GITHUB_SHA:0:7}"
          nix build --impure --print-build-logs --out-link console-result --expr '
            (builtins.getFlake (toString ./.))
              .packages.${builtins.currentSystem}.console
              .override {
                apiUrl = builtins.getEnv "TML_CONSOLE_API_URL";
                rev = builtins.getEnv "TML_CONSOLE_REV";
              }
          '

      - name: Resolve symlinks in console build
        run: cp -rL --no-preserve=mode console-result console-dist

      - uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          command: >-
            pages deploy console-dist
            --project-name=${{ vars.CF_PAGES_PROJECT }}
            --branch=main

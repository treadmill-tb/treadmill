name: treadmill-images
env:
  TERM: xterm # Makes tput work in actions output

# Producer-side image builds via the libguestfs pipeline
# (doc/images-libguestfs-build-plan.md). Each image *family* builds on its own
# hosted runner with a matched host architecture (KVM-accelerated libguestfs):
# Ubuntu on x86_64, Raspberry Pi OS on aarch64. The dispatch checkboxes select
# which families to actually build; the `prepare` job turns them into the build
# matrix. Add new families to that step as their build-image.sh path lands.
on:
  workflow_dispatch:
    inputs:
      build_ubuntu_server_2604:
        description: 'Build the Ubuntu Server 26.04 family'
        type: boolean
        default: true
      build_raspberrypios_13:
        description: 'Build the Raspberry Pi OS 13 family'
        type: boolean
        default: false
      upload_artifacts:
        description: 'Upload built images as workflow artifacts'
        type: boolean
        default: false
      push_to_ghcr:
        description: 'Push the built image layouts to ghcr.io'
        type: boolean
        default: false

# One run at a time per ref; do not cancel an in-flight (long) build.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read
  # Needed only when push_to_ghcr is set; harmless otherwise.
  packages: write

jobs:
  # Resolve the dispatch checkboxes into a build matrix: one entry per selected
  # family, carrying its runner architecture and the matching static puppet and
  # caddy packages. This is the single place that maps families -> (runner,
  # binaries).
  prepare:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.select.outputs.matrix }}
    steps:
      - name: Select image families
        id: select
        env:
          BUILD_UBUNTU_SERVER_2604: ${{ inputs.build_ubuntu_server_2604 }}
          BUILD_RASPBERRYPIOS_13: ${{ inputs.build_raspberrypios_13 }}
        run: |
          set -euo pipefail
          include='[]'
          add() { include="$(jq -c --argjson o "$1" '. + [$o]' <<<"$include")"; }

          if [ "$BUILD_UBUNTU_SERVER_2604" = "true" ]; then
            add '{"name":"ubuntu-server-2604","runs-on":"ubuntu-latest","puppet":"tml-puppet-static-x86_64","caddy":"tml-caddy-static-x86_64","backend":"nspawn"}'
          fi

          # The aarch64 Raspberry Pi OS family builds on a matched-arch hosted
          # runner (the libguestfs appliance has no cross-arch support).
          if [ "$BUILD_RASPBERRYPIOS_13" = "true" ]; then
            add '{"name":"raspberrypios-13","runs-on":"ubuntu-24.04-arm","puppet":"tml-puppet-static-aarch64","caddy":"tml-caddy-static-aarch64","backend":"nspawn"}'
          fi

          if [ "$(jq 'length' <<<"$include")" -eq 0 ]; then
            echo "::error::No image family selected; enable at least one." >&2
            exit 1
          fi
          echo "Selected families: $include"
          echo "matrix={\"include\":$include}" >> "$GITHUB_OUTPUT"

  build:
    needs: prepare
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.prepare.outputs.matrix) }}
    runs-on: ${{ matrix.runs-on }}

    steps:
      - uses: actions/checkout@v7

      - uses: cachix/install-nix-action@v31
      - uses: cachix/cachix-action@v17
        with:
          name: treadmill-tb
          # Read-only here; this re-uses the built puppets from the cache.
          skipPush: true

      # build-image.sh consumes prebuilt binaries; build them once per runner
      # (natively for the runner's architecture). Capture the store paths
      # directly rather than `-o <link>`, whose symlink would collide with the
      # in-tree `puppet/` crate directory.
      - name: Build puppet + caddy + image-util
        id: bins
        run: |
          set -euxo pipefail
          puppet="$(nix build --print-build-logs --no-link --print-out-paths ".#${{ matrix.puppet }}")"
          caddy="$(nix build --print-build-logs --no-link --print-out-paths ".#${{ matrix.caddy }}")"
          image_util="$(nix build --print-build-logs --no-link --print-out-paths '.#image-util')"
          echo "puppet=$puppet" >> "$GITHUB_OUTPUT"
          echo "caddy=$caddy" >> "$GITHUB_OUTPUT"
          echo "image_util=$image_util" >> "$GITHUB_OUTPUT"

      # The nspawn backend is fully VM-free: it provisions in a systemd-nspawn
      # container and does all image surgery (root grow, SD extraction, fstrim)
      # natively over a qemu-nbd-mapped device — no libguestfs appliance, so no
      # /dev/kvm dependency (the aarch64 runner lacks it; the appliance would
      # otherwise run under TCG) and no Nix `images` devshell (its prebuilt
      # libguestfs appliance is x86-only, so it can't even evaluate on the arm
      # runner). All tooling comes from apt; the puppet + image-util binaries are
      # still built via `nix build` (the step above).
      - name: Install image build toolchain (nspawn backend)
        if: ${{ matrix.backend == 'nspawn' }}
        run: |
          set -euxo pipefail
          sudo apt-get update
          # systemd-container: systemd-nspawn. qemu-utils: qemu-img + qemu-nbd.
          # cloud-guest-utils: growpart. e2fsprogs: resize2fs/e2fsck. mtools: FAT
          # edit. xz-utils: decompress the SD image. parted: partprobe.
          sudo apt-get install -y \
            systemd-container qemu-utils cloud-guest-utils e2fsprogs \
            mtools xz-utils parted curl
          sudo modprobe nbd max_part=16

      # Fetch + verify the upstream base, provision a qcow2 overlay delta (via the
      # selected backend, no guest boot), then assemble + validate the OCI layout.
      # This one keeps its intermediate blobs in out.build/, which every overlay
      # step below backs onto — hence all of them running in the same job.
      - name: Build base image layout
        id: build-base
        run: |
          set -euxo pipefail
          ./images/lib/build-image.sh "${{ matrix.name }}" \
            --puppet "${{ steps.bins.outputs.puppet }}/bin/tml-puppet" \
            --caddy "${{ steps.bins.outputs.caddy }}/bin/caddy" \
            --image-util "${{ steps.bins.outputs.image_util }}/bin/image-util" \
            --backend "${{ matrix.backend }}" \
            -o out

      # Each overlay is provisioned on top of the base build's byte-identical
      # delta, yielding a 3-root-layer chain (layer0 + base delta + overlay
      # delta) whose lower two blobs dedupe with the base image; sd images
      # (Raspberry Pi OS) additionally share its boot blob verbatim. The overlays
      # are independent of each other, so a failing one does not skip the next.
      - name: Build gha-runner image layout
        id: build-gha-runner
        if: ${{ !cancelled() && steps.build-base.outcome == 'success' }}
        run: |
          set -euxo pipefail
          overlay_args=(--variant gha-runner --base-delta out.build/delta.qcow2)
          if [ -f out.build/boot.fat ]; then
            overlay_args+=(--boot-fat out.build/boot.fat)
          fi
          ./images/lib/build-image.sh "${{ matrix.name }}" \
            --puppet "${{ steps.bins.outputs.puppet }}/bin/tml-puppet" \
            --caddy "${{ steps.bins.outputs.caddy }}/bin/caddy" \
            --image-util "${{ steps.bins.outputs.image_util }}/bin/image-util" \
            --backend "${{ matrix.backend }}" \
            "${overlay_args[@]}" \
            -o out-gha-runner

      - name: Build webide image layout
        id: build-webide
        if: ${{ !cancelled() && steps.build-base.outcome == 'success' }}
        run: |
          set -euxo pipefail
          overlay_args=(--variant webide --base-delta out.build/delta.qcow2)
          if [ -f out.build/boot.fat ]; then
            overlay_args+=(--boot-fat out.build/boot.fat)
          fi
          ./images/lib/build-image.sh "${{ matrix.name }}" \
            --puppet "${{ steps.bins.outputs.puppet }}/bin/tml-puppet" \
            --caddy "${{ steps.bins.outputs.caddy }}/bin/caddy" \
            --image-util "${{ steps.bins.outputs.image_util }}/bin/image-util" \
            --backend "${{ matrix.backend }}" \
            "${overlay_args[@]}" \
            -o out-webide

      # One artifact per OCI layout, each gated on its own build step: a variant
      # that failed leaves a half-written layout directory behind. The
      # intermediate build blobs in out.build/ are deliberately excluded.
      - name: Upload base image layout
        if: ${{ !cancelled() && inputs.upload_artifacts && steps.build-base.outcome == 'success' }}
        uses: actions/upload-artifact@v7
        with:
          name: treadmill-image-${{ matrix.name }}
          path: out/
          if-no-files-found: error

      - name: Upload gha-runner image layout
        if: ${{ !cancelled() && inputs.upload_artifacts && steps.build-gha-runner.outcome == 'success' }}
        uses: actions/upload-artifact@v7
        with:
          name: treadmill-image-${{ matrix.name }}-gha-runner
          path: out-gha-runner/
          if-no-files-found: error

      - name: Upload webide image layout
        if: ${{ !cancelled() && inputs.upload_artifacts && steps.build-webide.outcome == 'success' }}
        uses: actions/upload-artifact@v7
        with:
          name: treadmill-image-${{ matrix.name }}-webide
          path: out-webide/
          if-no-files-found: error

      # --- ghcr push (conditioned on push_to_ghcr input) -----------

      # Authenticate to ghcr; writes the credential to ~/.docker/config.json,
      # which skopeo reads by default in the push step below.
      - name: Log in to ghcr.io
        if: ${{ !cancelled() && inputs.push_to_ghcr }}
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # `skopeo copy` the OCI layout to ghcr.io/<owner>/<name>:{<sha>,latest}.
      # The custom `shell:` resolves skopeo once and puts it on PATH.
      # Push every layout that built: the base to ghcr.io/<owner>/<name> and each
      # overlay to ghcr.io/<owner>/<name>-<variant>, each tagged with the commit
      # sha and latest. The shared lower layers (layer0 + base delta) dedupe
      # across the repositories by digest.
      - name: Push image layouts to ghcr.io
        if: ${{ !cancelled() && inputs.push_to_ghcr }}
        shell: nix shell nixpkgs#skopeo --command bash -euo pipefail {0}
        env:
          BASE_OUTCOME: ${{ steps.build-base.outcome }}
          GHA_RUNNER_OUTCOME: ${{ steps.build-gha-runner.outcome }}
          WEBIDE_OUTCOME: ${{ steps.build-webide.outcome }}
        run: |
          # The runner ships a v1 /etc/containers/registries.conf, which this
          # (newer) skopeo rejects ("must be in v2 format"). Point it at our own
          # empty v2 config so it ignores the system file.
          CONTAINERS_REGISTRIES_CONF="${RUNNER_TEMP}/registries.conf"
          : > "$CONTAINERS_REGISTRIES_CONF"
          export CONTAINERS_REGISTRIES_CONF

          OWNER="$(printf '%s' "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')"
          push() { # <layout-dir> <repo>
            for tag in "${GITHUB_SHA}" latest; do
              echo "skopeo copy oci:$1 -> docker://$2:${tag}"
              skopeo copy --all "oci:$1" "docker://$2:${tag}"
            done
          }
          if [ "$BASE_OUTCOME" = success ]; then
            push out "ghcr.io/${OWNER}/${{ matrix.name }}"
          fi
          if [ "$GHA_RUNNER_OUTCOME" = success ]; then
            push out-gha-runner "ghcr.io/${OWNER}/${{ matrix.name }}-gha-runner"
          fi
          if [ "$WEBIDE_OUTCOME" = success ]; then
            push out-webide "ghcr.io/${OWNER}/${{ matrix.name }}-webide"
          fi

[package]
name = "treadmill-image-util"
version.workspace = true
edition.workspace = true
authors.workspace = true
license = "MIT OR Apache-2.0"
description = "Assemble and validate Treadmill OCI image layouts"

[[bin]]
name = "image-util"
path = "src/main.rs"

[dependencies]
treadmill-image-build = { version = "0.1.0", path = "../image-build" }

anyhow = { workspace = true }
clap = { workspace = true, features = ["derive"] }

[dev-dependencies]
serde_json = { workspace = true }
sha2 = { workspace = true }
tempfile = { workspace = true }

[lints]
workspace = true

          description: 'Expected request with `Content-Type: application/json`'
          content:
            text/plain:
              schema:
                type: string
        '422':
          description: Failed to deserialize the JSON body into the target type
          content:
            text/plain:
              schema:
                type: string
        '204':
          description: The grant was recorded.
        '404':
          description: No such image set, or it is not visible to the caller.
      security:
      - token: []
  /image-sets/{id}/grants/{subject_id}/{permission}:
    delete:
      tags:
      - Images
      summary: Revoke a grant on an image set
      operationId: revokeImageSetGrant
      parameters:
      - in: path
        name: id
        description: The image set's unique identifier.
        required: true
        schema:
          description: The image set's unique identifier.
          type: string
          format: uuid
        style: simple
      - in: path
        name: permission
        description: The permission being revoked (`use` or `manage`).
        required: true
        schema:
          description: The permission being revoked (`use` or `manage`).
          type: string
        style: simple
      - in: path
        name: subject_id
        description: The subject (user or group) the grant applies to.
        required: true
        schema:
          description: The subject (user or group) the grant applies to.
          type: string
          format: uuid
        style: simple
      responses:
        '401':
          description: 'Authentication failed: the bearer token is missing, malformed, expired, or revoked.'
        '403':
          description: The authenticated account is locked, or lacks permission for this resource.
        '204':
          description: The grant was revoked.
        '404':
          description: No matching grant to revoke.
      security:
      - token: []
components:
  securitySchemes:
    token:
      type: http
      scheme: bearer
      description: 'A Treadmill user API token, presented as `Authorization: Bearer <token>`.'
  schemas:
    AddImageSourceRequest:
      description: |-
        `POST /images/{digest}/sources`: add a registry source for an image,
        registering the image on first sight. The caller owns the source it adds;
        the image itself (its cached manifest projection) is non-owned and created
        implicitly when its digest is first sourced.
      type: object
      properties:
        registry:
          description: Registry authority (`host:port`) the image can be pulled from.
          type: string
        repository:
          description: Repository path within the registry.
          type: string
      required:
      - registry
      - repository
    AuditFeedQuery:
      description: Query parameters for an audit feed (`GET /{entity}/{id}/events`).
      type: object
      properties:
        cursor:
          description: Opaque keyset cursor from a previous response's `next_cursor`.
          type:
          - string
          - 'null'
        limit:
          description: |-
            Maximum number of events per page. Omitted or out-of-range values fall
            back to the server's default and bounds.
          type:
          - integer
          - 'null'
          format: uint32
          minimum: 0
    AuditFeedResponse:
      description: |-
        A page of rendered audit events for one entity, newest first.

        Paginated by keyset: when `next_cursor` is non-null, pass it back as the
        `cursor` query parameter to fetch the next (older) page; a null `next_cursor`
        means the last page.
      type: object
      properties:
        events:
          type: array
          items:
            $ref: '#/components/schemas/RenderedAuditRow'
        next_cursor:
          description: Opaque cursor for the next page, or null on the last page.
          type:
          - string
          - 'null'
      required:
      - events
    AuthProvidersResponse:
      description: |-
        Response body for the unauthenticated `/auth/providers` endpoint: which login
        methods a switchboard offers, so a frontend can render the right buttons
        without hardcoding provider knowledge.
      type: object
      properties:
        mock_identities:
          description: |-
            Built-in mock sign-in identities. Non-empty ONLY when the
            development-only mock provider is enabled; each is an unauthenticated,
            canned identity. A frontend MUST surface these as development-only.
          type: array
          items:
            $ref: '#/components/schemas/MockIdentityInfo'
        oauth:
          description: Real OAuth providers (e.g. GitHub) the user can start a login flow with.
          type: array
          items:
            $ref: '#/components/schemas/OAuthProviderInfo'
      required:
      - oauth
      - mock_identities
    AuthToken:
      type: string
    CallbackQuery:
      description: Query parameters the provider appends to the callback redirect.
      type: object
      properties:
        code:
          type: string
        state:
          type: string
      required:
      - code
      - state
    Console:
      description: The board's console, as the host sees it.
      oneOf:
      - type: object
        properties:
          baud:
            type: integer
            format: uint32
            minimum: 0
          device:
            description: |-
              The host-side device node. Prefer a stable `/dev/serial/by-id/...`
              path over a `/dev/ttyACM*` name, which is enumeration-order
              dependent.
            type: string
          kind:
            type: string
            const: uart
        additionalProperties: false
        required:
        - kind
        - device
        - baud
    CreateGenerationRequest:
      description: |-
        `POST /image-sets/{id}/generations`: append a new, immutable
        full-replacement generation of a set's membership.
      type: object
      properties:
        members:
          type: array
          items:
            $ref: '#/components/schemas/GenerationMemberSpec'
      required:
      - members
    CreateImageSetRequest:
      description: |-
        `POST /image-sets`: create an empty, named image set. The caller becomes
        its owner; membership is added afterwards via per-generation snapshots (see
        [`CreateGenerationRequest`]).
      type: object
      properties:
        label:
          description: Optional human-readable label.
          type:
          - string
          - 'null'
          default: null
        name:
          description: The stable, globally-unique moving-target handle a job references (by id).
          type: string
      required:
      - name
    DebugAccess:
      description: How the board is programmed and debugged.
      type: object
      properties:
        probe:
          $ref: '#/components/schemas/DebugProbe'
        protocol:
          description: |-
            The wire protocol, e.g. `swd`, `jtag`. Governed by convention, not a
            registry.
          type: string
      additionalProperties: false
      required:
      - protocol
      - probe
    DebugProbe:
      description: The debug probe attached to a board.
      type: object
      properties:
        model:
          description: e.g. `J-Link OB`, `ST-LINK/V2-1`.
          type: string
        serial:
          description: The probe's own serial, which is how a host-side tool addresses it.
          type:
          - string
          - 'null'
        vendor:
          description: e.g. `SEGGER`, `STMicroelectronics`.
          type: string
      additionalProperties: false
      required:
      - vendor
      - model
    Digest:
      description: |-
        A content-addressable OCI digest over 32 bytes of SHA-256.

        Formats as the canonical OCI string `sha256:<64 lower-case hex>`.
      type: string
    DigestPath:
      description: The `{digest}` segment of an image route.
      type: object
      properties:
        digest:
          description: The image's OCI manifest digest (`sha256:<hex>`).
          type: string
      required:
      - digest
    Dut:
      description: One device under test wired to a host.
      type: object
      properties:
        arch:
          description: |-
            The architectures of the board's cores, e.g. `cortex-m4`. An array
            because a heterogeneous-core part has more than one. May be empty.
          type: array
          items:
            type: string
        board:
          description: The board this is, e.g. `nrf52840dk`.
          type: string
        connectivity:
          description: |-
            What the board can talk over, e.g. `ble`, `ieee802154`, `usb`, `wifi`,
            `ethernet`, `can`. Governed by convention, not a registry. May be empty.
          type: array
          items:
            type: string
        console:
          anyOf:
          - $ref: '#/components/schemas/Console'
          - type: 'null'
        debug:
          anyOf:
          - $ref: '#/components/schemas/DebugAccess'
          - type: 'null'
        labels:
          description: As [`HostSpecV1::labels`], scoped to this DUT.
          type: object
          additionalProperties:
            type: string
        name:
          description: 'Display label, e.g. `nRF52840-DK #1`.'
          type:
          - string
          - 'null'
        serial:
          description: The board's **own** serial number, not its debug probe's.
          type:
          - string
          - 'null'
        vendor:
          type: string
      additionalProperties: false
      required:
      - vendor
      - board
      - arch
      - connectivity
      - labels
    DutSummary:
      description: One attached DUT, as a listing names it.
      type: object
      properties:
        board:
          type: string
        name:
          type:
          - string
          - 'null'
        vendor:
          type: string
      required:
      - vendor
      - board
    EnqueueJobResponse:
      description: 'Response body of `POST /jobs`: the id assigned to the freshly enqueued job.'
      type: object
      properties:
        host_requirements:
          description: |-
            How the job's host requirements met the fleet at submission. A job with
            `schedulable == 0` was still accepted — the fleet may change — but will
            sit queued until it does, which is otherwise indistinguishable from
            waiting for a busy host.
          allOf:
          - $ref: '#/components/schemas/HostRequirementsReport'
        job_id:
          type: string
          format: uuid
      required:
      - job_id
      - host_requirements
    GenerationMemberInfo:
      description: |-
        One member of a generation, as returned by the inspect route. A member is
        admissible for a host iff the host advertises its `platform_profile` and its
        `predicate` (if any) holds; the first admissible member in `index` order is
        selected.
      type: object
      properties:
        index:
          type: integer
          format: uint32
          minimum: 0
        manifest_digest:
          $ref: '#/components/schemas/Digest'
        platform_profile:
          type: string
        predicate:
          type:
          - string
          - 'null'
        usable:
          description: |-
            Whether the viewer may use some source of this member image. A set grant
            is necessary but not sufficient: `false` means the member has no source the
            viewer can reach (so a job would not resolve it for this viewer).
          type: boolean
        usable_by_grantees:
          description: |-
            Whether *every* subject holding a `use` grant on the set can source this
            member (for a public set, the grantees include the `everyone` subject).
            This is the owner-facing health signal: `false` flags a member some grantee
            cannot reach, so the set's `use` grant is unusable for them in practice.
            Vacuously `true` for a set with no `use` grants.
          type: boolean
      required:
      - manifest_digest
      - platform_profile
      - index
      - usable
      - usable_by_grantees
    GenerationMemberSpec:
      description: |-
        One member of a new generation; `index` is the member's array position in the
        request, used as the deterministic tie-break among equally-specific members.
      type: object
      properties:
        manifest_digest:
          description: |-
            Image to include; must already be registered (have at least one source,
            `POST /images/{digest}/sources`).
          allOf:
          - $ref: '#/components/schemas/Digest'
        platform_profile:
          description: |-
            The machine configuration this image is built for, e.g.
            `q35-virtio-uefi`, `rpi4-uboot-sd`. Matched by equality against the
            host spec's `platform.profiles`.
          type: string
        predicate:
          description: |-
            Optional CEL refinement narrowing this member within its profile, e.g.
            `host.resources.memory_mb >= 16384`. Parsed when the generation is
            created; a host it errors on simply does not select this member.
          type:
          - string
          - 'null'
          default: null
      required:
      - manifest_digest
      - platform_profile
    GenerationPath:
      description: The `{id}/generations/{n}` segments of an image-set generation route.
      type: object
      properties:
        id:
          description: The image set's unique identifier.
          type: string
          format: uuid
        n:
          description: The generation number within the set.
          type: integer
          format: uint32
          minimum: 0
      required:
      - id
      - n
    GrantPath:
      description: The `{id}/grants/{subject_id}/{permission}` segments of a grant route.
      type: object
      properties:
        id:
          description: The image set's unique identifier.
          type: string
          format: uuid
        permission:
          description: The permission being revoked (`use` or `manage`).
          type: string
        subject_id:
          description: The subject (user or group) the grant applies to.
          type: string
          format: uuid
      required:
      - id
      - subject_id
      - permission
    GroupMembership:
      description: |-
        One group the user belongs to, including transitive memberships (e.g. via
        nested groups or a linked GitHub org).
      type: object
      properties:
        group_id:
          type: string
          format: uuid
        name:
          type: string
        source:
          description: How the membership arose (`direct`, `github_org`, ...).
          type: string
        source_ref:
          description: |-
            The external reference backing an auto-sourced membership (e.g. the
            GitHub org id); empty for direct memberships.
          type: string
      required:
      - group_id
      - name
      - source
      - source_ref
    HostCreateRequest:
      description: |-
        A new host (`POST /hosts`): the `hosts` row and revision 1 of its spec are
        written in one transaction, so a host is never in an undescribed state.
      type: object
      properties:
        spec:
          description: |-
            The host's spec. Its `id` becomes the host's id: the client supplies the
            UUID so a spec is a self-contained document that can live in a git repo
            and be applied. Rejected with a [`HostSpecRejection`] naming the
            offending field if it does not validate.
          allOf:
          - $ref: '#/components/schemas/HostSpec'
      additionalProperties: false
      required:
      - spec
    HostInfo:
      description: |-
        A host as returned by `GET /hosts/{id}`: its operational state plus the
        whole admin-authored spec describing what it is.
      type: object
      properties:
        host_id:
          type: string
          format: uuid
        last_seen_at:
          description: |-
            The host's last heartbeat, or null if it has never reported (or its
            supervisor disconnected cleanly).
          type:
          - string
          - 'null'
          format: date-time
        live:
          description: |-
            Whether the host's supervisor has heartbeat recently enough to be
            considered schedulable, computed with the deployment's liveness window.
          type: boolean
        maintenance:
          description: |-
            Whether an operator has withheld this host from scheduling. A host in
            maintenance is neither dispatched onto nor preempted to free capacity.
          type: boolean
        name:
          type: string
        spec:
          description: |-
            The host's current spec, normalized to the latest version. Null only for
            a host that has never been described.
          anyOf:
          - $ref: '#/components/schemas/HostSpec'
          - type: 'null'
        spec_revision:
          description: The revision `spec` was read at. Null exactly when `spec` is.
          type:
          - integer
          - 'null'
          format: int32
      required:
      - host_id
      - name
      - live
      - maintenance
    HostListEntry:
      description: |-
        A host as returned by `GET /hosts`: its operational state plus a projection
        of its spec.

        A listing carries one row per host and a spec is unbounded — a host may list
        arbitrarily many DUTs, each with its debug probe and console wiring — so a
        row carries what a fleet view is scanned and filtered by, and the whole
        document is served by `GET /hosts/{id}` alone.
      type: object
      properties:
        host_id:
          type: string
          format: uuid
        last_seen_at:
          description: As [`HostInfo::last_seen_at`].
          type:
          - string
          - 'null'
          format: date-time
        live:
          description: As [`HostInfo::live`].
          type: boolean
        maintenance:
          description: As [`HostInfo::maintenance`].
          type: boolean
        name:
          type: string
        spec:
          description: |-
            The projection of the host's current spec. Null only for a host that has
            never been described.
          anyOf:
          - $ref: '#/components/schemas/HostSummary'
          - type: 'null'
        spec_revision:
          description: The revision `spec` was projected from. Null exactly when `spec` is.
          type:
          - integer
          - 'null'
          format: int32
      required:
      - host_id
      - name
      - live
      - maintenance
    HostPredicateError:
      description: One host the predicate could not be evaluated against.
      type: object
      properties:
        host_id:
          type: string
          format: uuid
        message:
          description: 'The evaluator''s own diagnostic, e.g. `no such key: model`.'
          type: string
        name:
          description: The host's name, so a report reads without a second lookup.
          type: string
      required:
      - host_id
      - name
      - message
    HostRequirementsReport:
      description: |-
        How a job's host requirements meet the fleet right now.

        Counts cover only the hosts the job's owner may `start` on, the same set
        the scheduler considers, so a caller cannot probe hosts it has no access to
        by submitting expressions and reading counts back.
      type: object
      properties:
        authorized:
          description: |-
            Hosts the owner may start jobs on at all. A zero here is a permissions
            problem, not a query problem.
          type: integer
          format: uint32
          minimum: 0
        compile_error:
          description: |-
            Set when the predicate does not compile, in which case nothing was
            evaluated and every match count is zero.
          type:
          - string
          - 'null'
        errored:
          description: |-
            Hosts whose evaluation errored, which counts as not matching. A
            forgotten `has()` guard otherwise looks exactly like an empty fleet, so
            these are surfaced rather than folded into the miss count.
          type: integer
          format: uint32
          minimum: 0
        errors:
          description: The first few evaluation errors, for diagnosis; `errored` is the total.
          type: array
          items:
            $ref: '#/components/schemas/HostPredicateError'
        image_matched:
          description: |-
            Of those, how many carry an admissible image-set member. Evaluated over
            the whole authorized set rather than only the predicate's matches, so
            the two failure modes stay distinguishable. Null when the request named
            no image set (a concrete image places no constraint on the host).
          type:
          - integer
          - 'null'
          format: uint32
          minimum: 0
        predicate_matched:
          description: Of those, how many the predicate admits.
          type: integer
          format: uint32
          minimum: 0
        schedulable:
          description: |-
            The hosts admitted by both: the ones that could actually run the job,
            named rather than counted so an author can see *which* fleet a query
            selected. Bounded by `authorized`, since nothing else is evaluated.
          type: array
          items:
            type: string
            format: uuid
      required:
      - authorized
      - predicate_matched
      - schedulable
      - errored
      - errors
    HostRequirementsRequest:
      description: |-
        A dry run of a job's host requirements (`POST /hosts/match`).

        Answers the question a queued job cannot: *would this ever be placed?*
      type: object
      properties:
        host_cel_predicate:
          description: The predicate to evaluate, as `JobRequest::host_cel_predicate`.
          type: string
        init_spec:
          description: |-
            The image the job would run, evaluated exactly as an enqueue would
            resolve it. Supplying it separates the two ways a job goes unplaced —
            the predicate matched nothing, or no image-set member admits the hosts
            it did match — which look identical from a job sitting queued. Omitted,
            only the predicate is evaluated.
          anyOf:
          - $ref: '#/components/schemas/JobInitSpec'
          - type: 'null'
          default: null
      additionalProperties: false
      required:
      - host_cel_predicate
    HostSpec:
      description: |-
        A host spec at whatever version it was written under.

        Untagged because each version type carries its own `spec_version` field:
        that keeps the discriminant inside the document being validated, so a
        rejection names the offending path (`duts[2].debug.probe.serail`) instead of
        the document root, which an internally-tagged enum cannot do.
      anyOf:
      - $ref: '#/components/schemas/HostSpecV1'
    HostSpecUpdateRequest:
      description: A new revision of a host's spec (`PUT /hosts/{id}/spec`).
      type: object
      properties:
        spec:
          description: The replacement spec. Its `id` must be the host being written.
          allOf:
          - $ref: '#/components/schemas/HostSpec'
      additionalProperties: false
      required:
      - spec
    HostSpecV1:
      description: Version 1 of the host spec.
      type: object
      properties:
        description:
          description: What this host is, in prose.
          type:
          - string
          - 'null'
        duts:
          description: |-
            The devices under test wired to this host, in the order the operator
            listed them. May be empty.
          type: array
          items:
            $ref: '#/components/schemas/Dut'
        id:
          description: Must equal the `host_id` of the host this document describes.
          type: string
          format: uuid
        labels:
          description: |-
            Operator-defined labels. CEL map indexing errors on an absent key, so
            predicates guard with `'key' in host.labels`.
          type: object
          additionalProperties:
            type: string
        location:
          description: Where in the site, e.g. `rack4/shelf2`. Free text.
          type:
          - string
          - 'null'
        name:
          description: |-
            Display handle, e.g. `cam-rpi4-01`. Deliberately not unique; nothing
            routes on it.
          type: string
        platform:
          $ref: '#/components/schemas/Platform'
        resources:
          $ref: '#/components/schemas/Resources'
        site:
          description: |-
            The site the host lives at, e.g. `cambridge`. Flat, so a predicate reads
            `host.site == 'cambridge'`.
          type: string
        spec_version:
          $ref: '#/components/schemas/SpecVersionV1'
      additionalProperties: false
      required:
      - spec_version
      - id
      - name
      - site
      - platform
      - resources
      - labels
      - duts
    HostSummary:
      description: |-
        What a listing shows of a host's spec: everything flat, and the identity of
        what is attached.
      type: object
      properties:
        description:
          type:
          - string
          - 'null'
        duts:
          description: |-
            The attached DUTs in spec order. Their serials, debug probes, consoles,
            architectures, connectivity and labels are in the full spec.
          type: array
          items:
            $ref: '#/components/schemas/DutSummary'
        labels:
          type: object
          additionalProperties:
            type: string
        location:
          type:
          - string
          - 'null'
        platform:
          $ref: '#/components/schemas/PlatformSummary'
        resources:
          $ref: '#/components/schemas/Resources'
        site:
          type: string
      required:
      - site
      - platform
      - resources
      - labels
      - duts
    HostUpdateRequest:
      description: |-
        A change to a host's operational state, carried by `PATCH /hosts/{id}`.

        Only the fields present are changed. Host *description* is not editable
        here: it lives in the host's spec, which is versioned separately.
      type: object
      properties:
        maintenance:
          description: Withhold the host from scheduling, or return it to service.
          type:
          - boolean
          - 'null'
    IdPath:
      description: A single `{id}` UUID segment.
      type: object
      properties:
        id:
          description: The resource's unique identifier.
          type: string
          format: uuid
      required:
      - id
    ImageInfo:
      description: |-
        A registered image, as returned by the catalog list/inspect routes. An image
        is non-owned; ownership lives on its `sources`.
      type: object
      properties:
        artifact_type:
          type: string
        created_at:
          type: string
          format: date-time
        manifest_digest:
          $ref: '#/components/schemas/Digest'
        sources:
          type: array
          items:
            $ref: '#/components/schemas/ImageSourceInfo'
        title:
          type:
          - string
          - 'null'
      required:
      - manifest_digest
      - artifact_type
      - created_at
      - sources
    ImageSetGenerationInfo:
      description: One immutable generation (membership snapshot) of an image set.
      type: object
      properties:
        created_at:
          type: string
          format: date-time
        created_by:
          type:
          - string
          - 'null'
          format: uuid
        generation:
          type: integer
          format: uint32
          minimum: 0
        members:
          type: array
          items:
            $ref: '#/components/schemas/GenerationMemberInfo'
        set_id:
          type: string
          format: uuid
      required:
      - set_id
      - generation
      - created_at
      - members
    ImageSetGrantInfo:
      description: One grant on an image set, as returned by the list-grants route.
      type: object
      properties:
        permission:
          $ref: '#/components/schemas/ImageSetPermission'
        subject_id:
          type: string
          format: uuid
      required:
      - subject_id
      - permission
    ImageSetGrantRequest:
      description: '`POST /image-sets/{id}/grants`: grant `permission` on the set to a subject.'
      type: object
      properties:
        permission:
          $ref: '#/components/schemas/ImageSetPermission'
        subject_id:
          type: string
          format: uuid
      required:
      - subject_id
      - permission
    ImageSetInfo:
      description: A named, mutable image set, as returned by the catalog list/inspect routes.
      type: object
      properties:
        created_at:
          type: string
          format: date-time
        id:
          type: string
          format: uuid
        label:
          type:
          - string
          - 'null'
        latest_generation:
          description: The set's latest generation number, or null if it has none yet.
          type:
          - integer
          - 'null'
          format: uint32
          minimum: 0
        name:
          type: string
        owner_id:
          type:
          - string
          - 'null'
          format: uuid
      required:
      - id
      - name
      - created_at
    ImageSetPermission:
      description: A permission on an image set.
      oneOf:
      - description: May run a job referencing the set (and so its member images).
        type: string
        const: use
      - description: May create generations and manage grants (owner holds this implicitly).
        type: string
        const: manage
    ImageSourceGrantInfo:
      description: One grant on an image source, as returned by the list-grants route.
      type: object
      properties:
        permission:
          $ref: '#/components/schemas/ImageSourcePermission'
        subject_id:
          type: string
          format: uuid
      required:
      - subject_id
      - permission
    ImageSourceGrantRequest:
      description: |-
        `POST /images/{digest}/sources/{source_id}/grants`: grant `permission` on a
        source to a subject.
      type: object
      properties:
        permission:
          $ref: '#/components/schemas/ImageSourcePermission'
        subject_id:
          type: string
          format: uuid
      required:
      - subject_id
      - permission
    ImageSourceInfo:
      description: |-
        One registry source of a registered image — the ownable, grantable catalog
        entity — as returned by the inspect routes. `permissions` is the *viewer's*
        permissions on this source (like host/job permission surfacing).
      type: object
      properties:
        id:
          type: string
          format: uuid
        owner_id:
          description: The source's owner, or null if orphaned.
          type:
          - string
          - 'null'
          format: uuid
        permissions:
          description: The viewer's permissions on this source.
          type: array
          items:
            $ref: '#/components/schemas/ImageSourcePermission'
        registry:
          type: string
        repository:
          type: string
        status:
          description: '`external`, `canonical`, or `system`.'
          type: string
      required:
      - id
      - registry
      - repository
      - status
      - permissions
    ImageSourcePermission:
      description: |-
        A permission on an image source. A "public" (unauthenticated) source is one
        that grants the well-known `everyone` subject `use`.
      oneOf:
      - description: May pull the image from this source (run jobs that resolve to it).
        type: string
        const: use
      - description: May manage the source's grants and delete it (owner holds this implicitly).
        type: string
        const: manage
    JobImageRef:
      description: |-
        What a job is based off, as seen by `GET /jobs/{id}`: a concrete image, an
        image set (with the frozen generation), or a resume/restart of an earlier
        job. The concrete manifest digest actually dispatched is reported separately
        as `resolved_image_digest`.
      oneOf:
      - description: Based off a concrete catalog image, addressed by its manifest digest.
        type: object
        properties:
          manifest_digest:
            $ref: '#/components/schemas/Digest'
          type:
            type: string
            const: image
        required:
        - type
        - manifest_digest
      - description: |-
          Based off a registered image *set*, addressed by its id plus the frozen
          generation; the concrete member is chosen at dispatch.
        type: object
        properties:
          generation:
            type: integer
            format: uint32
            minimum: 0
          set_id:
            type: string
            format: uuid
          type:
            type: string
            const: image_set
        required:
        - type
        - set_id
        - generation
      - description: Resumes a previously started job.
        type: object
        properties:
          job_id:
            type: string
            format: uuid
          type:
            type: string
            const: resume
        required:
        - type
        - job_id
      - description: Restarts a previously started job (inherits its image reference).
        type: object
        properties:
          job_id:
            type: string
            format: uuid
          type:
            type: string
            const: restart
        required:
        - type
        - job_id
    JobInfo:
      description: |-
        The full server-side view of a single job, returned by `GET /jobs/{id}`.

        Covers the job's identity, ownership, lifecycle state, the spec it was
        enqueued with, and — once it has run — its placement and terminal outcome.
        Secret parameters are redacted (see [`JobParameterView`]).
      type: object
      properties:
        dispatched_on_host_id:
          description: The host the job is (or was) dispatched on; null if unplaced.
          type:
          - string
          - 'null'
          format: uuid
        exit_message:
          description: A human-readable detail accompanying termination, if any.
          type:
          - string
          - 'null'
        host_cel_predicate:
          description: |-
            Host eligibility tags this job requires (superset match against a host's
            tags).
            The CEL expression this job's host had to satisfy, as submitted.
          type: string
        image:
          description: What the job is based off.
          allOf:
          - $ref: '#/components/schemas/JobImageRef'
        initializing_stage:
          description: The sub-stage while `state` is `initializing`; null otherwise.
          anyOf:
          - $ref: '#/components/schemas/JobInitializingStage'
          - type: 'null'
        job_id:
          type: string
          format: uuid
        job_ip_address:
          description: The job's internal IP address (generally not publicly routable).
          type:
          - string
          - 'null'
          format: ip
        label:
          description: The user-provided display label, if any.
          type:
          - string
          - 'null'
        lease_duration_secs:
          description: The job's protected window, in seconds, measured from `started_at`.
          type: integer
          format: int64
        lease_expires_at:
          description: |-
            When the lease expires (`started_at + lease_duration`); null until the
            job starts.
          type:
          - string
          - 'null'
          format: date-time
        lease_expiry_action:
          description: What happens when the lease expires.
          allOf:
          - $ref: '#/components/schemas/JobLeaseExpiryAction'
        owner_id:
          description: |-
            Owning subject (user or group); null if the owner was deleted
            (orphaned).
          type:
          - string
          - 'null'
          format: uuid
        parameters:
          description: Job parameters, keyed by name; secret values are redacted.
          type: object
          additionalProperties:
            $ref: '#/components/schemas/JobParameterView'
        permissions:
          description: The viewer's permissions on this job.
          type: array
          items:
            $ref: '#/components/schemas/JobPermission'
        queued_at:
          description: When the job was enqueued.
          type: string
          format: date-time
        resolved_image_digest:
          description: |-
            The concrete manifest digest actually dispatched, recorded at dispatch;
            null until then.
          anyOf:
          - $ref: '#/components/schemas/Digest'
          - type: 'null'
        restart_policy:
          $ref: '#/components/schemas/RestartPolicyState'
        services:
          description: The set of currently announced services by the job.
          type: array
          items:
            $ref: '#/components/schemas/JobServiceView'
        started_at:
          description: When the job was dispatched onto a host; null if not yet started.
          type:
          - string
          - 'null'
          format: date-time
        state:
          description: Where the job is in its lifecycle.
          allOf:
          - $ref: '#/components/schemas/JobState'
        task_exit_status:
          description: |-
            The user workload's success/failure outcome, orthogonal to
            `termination_reason`; null if never reported.
          anyOf:
          - $ref: '#/components/schemas/TaskExitStatus'
          - type: 'null'
        terminated_at:
          description: When the job was finalized; null until then.
          type:
          - string
          - 'null'
          format: date-time
        termination_reason:
          description: Why the job terminated; null until finalized.
          anyOf:
          - $ref: '#/components/schemas/TerminationReason'
          - type: 'null'
      required:
      - job_id
      - state
      - image
      - restart_policy
      - host_cel_predicate
      - parameters
      - lease_duration_secs
      - lease_expiry_action
      - queued_at
      - services
      - permissions
    JobInitSpec:
      oneOf:
      - description: Resume a previously started job.
        type: object
        properties:
          job_id:
            type: string
            format: uuid
          type:
            type: string
            const: resume
        required:
        - type
        - job_id
      - description: Restart a previously started job (inherits its image reference).
        type: object
        properties:
          job_id:
            type: string
            format: uuid
          type:
            type: string
            const: restart
        required:
        - type
        - job_id
      - description: |-
          Base this job off a concrete image registered in the switchboard
          catalog, addressed by its OCI manifest digest. At dispatch the
          switchboard resolves the image to its registry locations for the
          supervisor.
        type: object
        properties:
          manifest_digest:
            $ref: '#/components/schemas/Digest'
          type:
            type: string
            const: image
        required:
        - type
        - manifest_digest
      - description: |-
          Base this job off a registered image *set*, addressed by its stable id.
          `generation` pins a specific membership snapshot; when omitted, the
          set's latest generation is resolved and frozen onto the job at enqueue.
          After a host is chosen, the switchboard matcher selects the generation's
          member whose required host tags the chosen host satisfies and dispatches
          that concrete member.
        type: object
        properties:
          generation:
            type:
            - integer
            - 'null'
            format: uint32
            default: null
            minimum: 0
          set_id:
            type: string
            format: uuid
          type:
            type: string
            const: image_set
        required:
        - type
        - set_id
    JobInitializingStage:
      description: |-
        The fine-grained stage of a job that is still coming up, exposed as
        `initializing_stage` on [`JobInfo`] while its `state` is `initializing` (and
        null in every other state). A job advances through these stages in order as
        the host fetches its image, allocates resources, provisions the environment,
        and boots, before it becomes `ready`.
      oneOf:
      - description: Generic starting stage, reported before any more specific stage applies.
        type: string
        const: starting
      - description: Fetching the job's image.
        type: string
        const: fetching_image
      - description: Acquiring resources (such as the root filesystem) for the environment.
        type: string
        const: allocating
      - description: Applying the requested customizations to the base system.
        type: string
        const: provisioning
      - description: The host is booting; the job becomes `ready` once it is up.
        type: string
        const: booting
    JobLeaseExpiryAction:
      description: What happens when a job's lease expires.
      oneOf:
      - description: 'Hard deadline: the job is stopped (`execution_timeout`).'
        type: string
        const: terminate
      - description: |-
          The job keeps running unprotected and becomes reclaimable: the scheduler
          may stop it (`preempted`) to place a job with no idle host available.
          Absent that demand it runs on past its lease.
        type: string
        const: preempt
    JobListResponse:
      description: |-
        Response body of `GET /jobs`: a page of jobs the caller can read, newest
        first.

        Pagination is **keyset** on `(queued_at, job_id)` descending: when
        `next_cursor` is non-null, pass it back as the `cursor` query parameter to
        fetch the next page; a null `next_cursor` means the last page. There is no
        total count.
      type: object
      properties:
        jobs:
          type: array
          items:
            $ref: '#/components/schemas/JobSummary'
        next_cursor:
          description: Opaque cursor for the next page, or null on the last page.
          type:
          - string
          - 'null'
      required:
      - jobs
    JobParameter:
      description: |-
        One parameter supplied with a job at enqueue (`POST /jobs`), passed through
        to the puppet daemon running the workload.

        Flag a parameter `secret` to have its value withheld wherever the job is
        later read back (it surfaces as a redacted [`JobParameterView`]); non-secret
        parameters are returned verbatim.
      type: object
      properties:
        secret:
          description: |-
            Whether to treat the value as secret (withheld when the job is read
            back).
          type: boolean
        value:
          description: The parameter's value.
          type: string
      required:
      - value
      - secret
    JobParameterView:
      description: |-
        One job parameter as exposed by `GET /jobs/{id}`. A parameter flagged
        `secret` is **redacted**: its `value` is null and only the key and the
        `secret` flag are visible. Non-secret parameters carry their plaintext
        `value`.
      type: object
      properties:
        secret:
          description: Whether this parameter was submitted as secret.
          type: boolean
        value:
          description: The plaintext value, or null when the parameter is secret (withheld).
          type:
          - string
          - 'null'
      required:
      - secret
    JobPermission:
      description: |-
        A permission on a job. `permissions` on [`JobInfo`] reports which of these
        the viewer holds (an owner or global admin holds all of them).
      oneOf:
      - description: May read the job (its info, listing, and console logs).
        type: string
        const: read
      - description: May request the job's termination.
        type: string
        const: stop
      - description: |-
          May perform privileged operations on the job, such as resuming or
          restarting it (owner holds this implicitly).
        type: string
        const: manage
    JobRequest:
      type: object
      properties:
        host_cel_predicate:
          description: |-
            Host eligibility as a single CEL expression, evaluated with the
            candidate host's spec bound as `host`; the host runs the job only if it
            evaluates true. `host.duts` is in scope, so one expression covers both
            the host and its attached DUTs.

            An evaluation error means that host does not match — never a job
            failure. Absent, defaults to `true`, matching every host.
          type: string
          default: 'true'
        init_spec:
          description: What kind of job this is.
          allOf:
          - $ref: '#/components/schemas/JobInitSpec'
        label:
          description: |-
            An optional display label for the job: printable ASCII, bounded in
            length, not unique. Changeable after enqueue via `PATCH /jobs/{id}`.
          type:
          - string
          - 'null'
          default: null
        lease_duration:
          description: |-
            The job's protected window, measured from its start. Absent, the
            deployment default applies.
          type:
          - string
          - 'null'
        lease_expiry_action:
          description: What happens when the lease expires. Absent, `terminate`.
          anyOf:
          - $ref: '#/components/schemas/JobLeaseExpiryAction'
          - type: 'null'
          default: null
        owner:
          description: |-
            The subject (user or group) to own the enqueued job. Must be the caller
            itself or a group the caller is a member of; absent, ownership defaults
            to the caller. Ownership decides who can later read, stop, and manage the
            job.
          type:
          - string
          - 'null'
          format: uuid
          default: null
        parameters:
          description: |-
            A hash map of parameters provided to this job execution. These
            parameters are provided to the puppet daemon.
          type: object
          additionalProperties:
            $ref: '#/components/schemas/JobParameter'
        restart_policy:
          $ref: '#/components/schemas/RestartPolicy'
      required:
      - init_spec
      - restart_policy
      - parameters
    JobServiceCredentials:
      description: |-
        Access credentials for one of a job's announced services, returned by
        `POST /jobs/{id}/services/{service}/token`.
      type: object
      properties:
        endpoints:
          description: |-
            Every gateway hostname + port the service is published under, primary
            first. The gateway hostname already contains the job-part (i.e.,
            `<service>-<job-id>.<gw-fqdn>`).

            The same token is accepted at each, so a client may substitute
            the host of `url` for any of these.
          type: array
          items:
            $ref: '#/components/schemas/JobServiceEndpoint'
        expires_at:
          description: |-
            When the token stops being accepted. Minting again yields a fresh one;
            an already-minted token is not invalidated before this by anything,
            including the job ending or the caller's access being revoked.
          type: string
          format: date-time
        token:
          description: The signed token admitting the caller to this one service.
          allOf:
          - $ref: '#/components/schemas/Secret'
      required:
      - endpoints
      - token
      - expires_at
    JobServiceEndpoint:
      description: An endpoint under which a job's announced service can be reached.
      type: object
      properties:
        hostname:
          description: |-
            The gateway hostname the service is published under.

            Already contains the job-part (i.e., `<service>-<job-id>.<gw-fqdn>`).
          type: string
        port:
          description: The port under which the gateway can be reached at `domain`.
          type: integer
          format: uint16
          maximum: 65535
          minimum: 0
      required:
      - hostname
      - port
    JobServicePath:
      description: The `{id}/services/{service}` segments of a job service route.
      type: object
      properties:
        id:
          description: The job's unique identifier.
          type: string
          format: uuid
        service:
          description: The service's name within the job, as the job announced it.
          type: string
      required:
      - id
      - service
    JobServiceView:
      description: |-
        One service a running job announces, as exposed by `GET /jobs/{id}`.

        All three fields are opaque to the switchboard, which stores and echoes them
        without interpretation. `name` identifies the service within its job,
        `label` is optional human-readable text to display, and `protocol` is a
        token the client interprets to decide how to connect (`webapp`, `sshws`, …).
      type: object
      properties:
        label:
          type:
          - string
          - 'null'
        name:
          type: string
        protocol:
          type: string
      required:
      - name
      - protocol
    JobState:
      description: |-
        Where a job is in its execution lifecycle: queued → assigned → initializing
        → ready → terminating → finalized.
      oneOf:
      - description: Enqueued, awaiting placement onto a host by the scheduler.
        type: string
        const: queued
      - description: Placed on a host but not yet reported as executing.
        type: string
        const: assigned
      - description: The host is bringing the job up (see `initializing_stage`).
        type: string
        const: initializing
      - description: The job is running and ready.
        type: string
        const: ready
      - description: The job is shutting down.
        type: string
        const: terminating
      - description: 'Terminal: the job has ended (see `termination_reason`).'
        type: string
        const: finalized
    JobSummary:
      description: |-
        A compact per-job row for the `GET /jobs` listing — identity, ownership,
        lifecycle state, and the key timestamps/outcome, without the heavier per-job
        detail (parameters, target requirements) that [`JobInfo`] carries. Fetch the
        full view with `GET /jobs/{id}`.
      type: object
      properties:
        dispatched_on_host_id:
          description: The host the job is (or was) dispatched on; null if unplaced.
          type:
          - string
          - 'null'
          format: uuid
        image:
          $ref: '#/components/schemas/JobImageRef'
        job_id:
          type: string
          format: uuid
        label:
          description: The user-provided display label, if any.
          type:
          - string
          - 'null'
        lease_expires_at:
          description: When the lease expires; null until the job starts.
          type:
          - string
          - 'null'
          format: date-time
        lease_expiry_action:
          $ref: '#/components/schemas/JobLeaseExpiryAction'
        owner_id:
          description: Owning subject (user or group); null if orphaned.
          type:
          - string
          - 'null'
          format: uuid
        queued_at:
          type: string
          format: date-time
        started_at:
          type:
          - string
          - 'null'
          format: date-time
        state:
          $ref: '#/components/schemas/JobState'
        task_exit_status:
          anyOf:
          - $ref: '#/components/schemas/TaskExitStatus'
          - type: 'null'
        terminated_at:
          type:
          - string
          - 'null'
          format: date-time
        termination_reason:
          anyOf:
          - $ref: '#/components/schemas/TerminationReason'
          - type: 'null'
      required:
      - job_id
      - state
      - image
      - queued_at
      - lease_expiry_action
    LeaseRejection:
      description: |-
        Why a requested lease change was refused (`409 Conflict` on
        `PATCH /jobs/{id}`). The whole request is rejected, so a label change sent
        alongside a refused lease change is not applied either.
      type: object
      properties:
        code:
          $ref: '#/components/schemas/LeaseRejectionCode'
        max_lease_expires_at:
          description: The latest expiry that would have been granted, when one exists.
          type:
          - string
          - 'null'
          format: date-time
        message:
          description: Human-readable explanation; not intended to be parsed.
          type: string
        retry_after_secs:
          description: When asking again could plausibly succeed; null if never.
          type:
          - integer
          - 'null'
          format: int64
      required:
      - code
      - message
    LeaseRejectionCode:
      description: |-
        The machine-readable discriminant of a [`LeaseRejection`]. Clients must
        tolerate unknown values.
      oneOf:
      - description: The job is finalized, or a stop has already been signalled for it.
        type: string
        const: job_terminating
      - description: |-
          An absolute lease end was requested for a job that has not started, so
          there is no clock to measure it against.
        type: string
        const: not_started
      - description: A deployment policy caps the lease below what was requested.
        type: string
        const: policy_limit
      - description: The resources cannot be held for as long as requested.
        type: string
        const: resource_pressure
    LeaseSpec:
      description: 'A lease change: `"30m"` (set), `"+30m"` / `"-10m"` (adjust), or an RFC 3339 timestamp (absolute expiry).'
      type: string
    LinkedGitHub:
      description: A linked GitHub identity, reduced to the fields safe to expose publicly.
      type: object
      properties:
        login:
          description: The user's current GitHub login/handle.
          type: string
        profile_url:
          description: Canonical URL of the GitHub profile (`https://github.com/<login>`).
          type: string
      required:
      - login
      - profile_url
    ListQuery:
      description: Query parameters for `GET /jobs`.
      type: object
      properties:
        cursor:
          description: Opaque keyset cursor from a previous response's `next_cursor`.
          type:
          - string
          - 'null'
        limit:
          description: |-
            Maximum number of jobs per page. Omitted or out-of-range values fall
            back to the server's default and bounds.
          type:
          - integer
          - 'null'
          format: uint32
          minimum: 0
    LoginCompleteRequest:
      description: |-
        Request body for `POST /auth/login/complete`: finish a staged login. Sent as
        JSON or form-encoded data.
      type: object
      properties:
        staged_id:
          description: The staged login, from [`LoginStagedResponse::staged_id`].
          type: string
          format: uuid
        staged_secret:
          description: Its one-time secret, from [`LoginStagedResponse::staged_secret`].
          allOf:
          - $ref: '#/components/schemas/Secret'
        tos_version:
          description: |-
            The ToS version the user was shown and accepted (only mandatory if
            `required` contained `"tos"`). Must match the version currently in
            force, so a concurrent ToS bump cannot record consent to text the user
            never saw.
          type:
          - integer
          - 'null'
          format: int32
      required:
      - staged_id
      - staged_secret
    LoginResponse:
      description: |-
        Response Body that [`login_handler`] emits.

        Indicates that the user successfully authenticated, and was issued `token`, which inherits the
        user's credentials, and will expire at `expires_at`.
      type: object
      properties:
        expires_at:
          type: string
          format: date-time
        token:
          $ref: '#/components/schemas/AuthToken'
      required:
      - token
      - expires_at
    LoginStagedResponse:
      description: |-
        Response body for a staged login: the callback has verified the identity
        (e.g., OAuth token exchanged, admission passed) and staged the login
        server-side. Every interactive login is staged; the caller finishes it by
        `POST`ing the `(staged_id, staged_secret)` pair to `/auth/login/complete`,
        which is the sole point that mints the session token.

        `required` lists what the completion must additionally provide. An empty
        list means the login is ready to claim: complete immediately, no extra
        fields needed. The following is a non-exhaustive list of `required` steps:

        - `tos`: the user must (re)accept the latest version of the ToS, echoing
          the `tos_version` actually shown.

        Returned as `200` by the OAuth callback (a browser flow that declared a
        `return_to` is instead `302`-redirected there with the pair in the query),
        and as `409 Conflict` by `/auth/login/complete` when the presented
        completion is still missing a required step (with a fresh pair — the
        presented one is consumed).

        `staged_secret` must be kept secret and treated equivalently to an auth
        token, as it can mint an auth token.
      type: object
      properties:
        required:
          description: |-
            What the completion step must provide; empty means ready to claim
            (recognized steps are documented on the type).
          type: array
          items:
            type: string
        staged_id:
          description: Identifies the staged login to `/auth/login/complete`.
          type: string
          format: uuid
        staged_secret:
          description: |-
            Single-use secret that `/auth/login/complete` exchanges for an auth
            token.
          allOf:
          - $ref: '#/components/schemas/Secret'
        tos_version:
          description: |-
            The ToS version the user is being asked to accept (if `required`
            contains `"tos"`), echoed back on completion so consent is recorded
            against the text actually shown.
          type:
          - integer
          - 'null'
          format: int32
      required:
      - required
      - staged_id
      - staged_secret
    MockIdentityInfo:
      description: A built-in mock identity advertised by `/auth/providers` (development only).
      type: object
      properties:
        key:
          description: Identity selector passed back to the mock login endpoint.
          type: string
        label:
          description: Human-readable label, e.g. `"alice (admin)"`.
          type: string
        login_path:
          description: |-
            Path, relative to the switchboard origin, that starts this identity's
            login, e.g. `"/api/v1/auth/mock/login?identity=alice"`.
          type: string
      required:
      - key
      - label
      - login_path
    NatsConsoleInputCredentials:
      description: |-
        Connection credentials for sending typed input to a job's serial console
        over NATS, returned by `POST /jobs/{id}/nats-console-input-token`.

        The token is a short-lived **bearer** user JWT that may *publish* to this
        job's console-input subject (`subject`) — nothing else. Every publish is
        recorded server-side, so treat the channel as monitored; feedback (echo)
        arrives through the separate log-streaming (read) channel. As with
        [`NatsLogStreamCredentials`], the token gates connect time only: an
        established connection outlives its expiry, and a client re-requests
        credentials when it next reconnects, after roughly `expires_in_secs`.
      type: object
      properties:
        expires_in_secs:
          description: |-
            Seconds until the token's `exp`; re-request credentials after this
            elapses (only needed to open a *new* connection).
          type: integer
          format: uint64
          minimum: 0
        nats_url:
          description: |-
            Plain-TCP NATS client URL (e.g. `nats://nats.example:4222`), for native
            clients that speak the binary protocol. Nullable: a deployment may
            choose to expose only the WebSocket endpoint publicly, in which case
            only `websocket_url` is returned. Browsers cannot use this — they must
            use `websocket_url`.
          type:
          - string
          - 'null'
        subject:
          description: 'The subject to publish typed input to: `console-in.<job-id>`.'
          type: string
        token:
          description: Bearer user JWT authorizing publish to `subject`.
          allOf:
          - $ref: '#/components/schemas/Secret'
        websocket_url:
          description: |-
            NATS **WebSocket** URL (e.g. `wss://nats.example:443`), for browser
            clients, which cannot speak the plain TCP protocol. Absent when the
            deployment does not expose a WebSocket listener; a browser client
            cannot send console input against such a deployment.
          type:
          - string
          - 'null'
      required:
      - subject
      - token
      - expires_in_secs
    NatsLogStreamCredentials:
      description: |-
        Connection credentials for tailing/replaying a job's console logs over NATS,
        returned by `POST /jobs/{id}/nats-log-token`.

        The token is a short-lived **bearer** user JWT scoped to this job only: it
        may *subscribe* to the job's log subjects (`subject`) and its own inboxes
        (`inbox_prefix`), and *publish* to the slice of the JetStream API needed to
        run an ordered consumer against the job's stream (`stream`) — enough to
        replay stored history and then follow live. The client connects with the
        token string alone (no nkey seed) to whichever endpoint suits its transport:
        `websocket_url` for browsers, `nats_url` for native TCP clients. The same
        token authorizes either. The token only needs to be valid at connect time —
        an established NATS connection is not dropped when the JWT expires — so a
        client re-requests credentials when it next reconnects, after roughly
        `expires_in_secs`.
      type: object
      properties:
        expires_in_secs:
          description: |-
            Seconds until the token's `exp`; re-request credentials after this
            elapses (only needed to open a *new* connection).
          type: integer
          format: uint64
          minimum: 0
        inbox_prefix:
          description: |-
            Inbox prefix the client **must** configure on its connection
            (`_INBOX.logs-<job-id>`): the token's subscribe permission covers only
            inboxes under this prefix, not the account-default `_INBOX.>`.
          type: string
        jetstream_domain:
          description: |-
            The server's JetStream domain, when it is configured with one; the
            client must address the JetStream API through it. Usually absent.
          type:
          - string
          - 'null'
        nats_url:
          description: |-
            Plain-TCP NATS client URL (e.g. `nats://nats.example:4222`), for native
            clients that speak the binary protocol. Nullable: a deployment may
            choose to expose only the WebSocket endpoint publicly, in which case
            only `websocket_url` is returned. Browsers cannot use this — they must
            use `websocket_url`.
          type:
          - string
          - 'null'
        stream:
          description: 'JetStream stream holding this job''s logs: `logs-<job-id>`.'
          type: string
        subject:
          description: |-
            Subject wildcard covering all of this job's log channels:
            `logs.<job-id>.>`.
          type: string
        token:
          description: Bearer user JWT authorizing the scope described above.
          allOf:
          - $ref: '#/components/schemas/Secret'
        websocket_url:
          description: |-
            NATS **WebSocket** URL (e.g. `wss://nats.example:443`), for browser
            clients, which cannot speak the plain TCP protocol. Absent when the
            deployment does not expose a WebSocket listener; a browser client cannot
            stream logs against such a deployment.
          type:
          - string
          - 'null'
      required:
      - subject
      - stream
      - inbox_prefix
      - token
      - expires_in_secs
    OAuthProviderInfo:
      description: A real OAuth provider advertised by `/auth/providers`.
      type: object
      properties:
        display_name:
          description: Human-readable label for a button, e.g. `"GitHub"`.
          type: string
        login_path:
          description: |-
            Path, relative to the switchboard origin, that starts the login flow,
            e.g. `"/api/v1/auth/github/login"`.
          type: string
        name:
          description: Stable provider key, e.g. `"github"`.
          type: string
      required:
      - name
      - display_name
      - login_path
    Platform:
      description: The machine a host is, and the images it can boot.
      oneOf:
      - type: object
        properties:
          arch:
            description: |-
              The host's own CPU architecture, e.g. `aarch64`, `x86_64`.

              Redundant — a profile implies it — but kept so "any aarch64 host"
              does not require enumerating profiles. Nothing enforces consistency
              between the two.
            type: string
          kind:
            type: string
            const: physical
          model:
            type: string
          profiles:
            description: |-
              The whole machine configurations this host can boot, e.g.
              `rpi4-uboot-sd`, `q35-virtio-uefi`, `q35-virtio-bios`,
              `netboot-nbd`. A profile names a complete configuration the way a
              target triple does; an image set member matches one by equality.

              An array because one host may genuinely serve several. Governed by
              convention, not a registry.
            type: array
            items:
              type: string
          vendor:
            type: string
        additionalProperties: false
        required:
        - kind
        - arch
        - profiles
        - vendor
        - model
      - type: object
        properties:
          arch:
            description: The architecture the guest is presented with.
            type: string
          hypervisor:
            description: e.g. `qemu`.
            type: string
          kind:
            type: string
            const: virtual
          profiles:
            description: As [`Platform::Physical::profiles`].
            type: array
            items:
              type: string
        additionalProperties: false
        required:
        - kind
        - arch
        - profiles
        - hypervisor
    PlatformKind:
      description: Which [`Platform`] variant a host is, without its variant-specific fields.
      type: string
      enum:
      - physical
      - virtual
    PlatformSummary:
      description: |-
        A [`Platform`](crate::host_spec::Platform) without its variant-specific
        fields — vendor and model, or hypervisor.
      type: object
      properties:
        arch:
          type: string
        kind:
          $ref: '#/components/schemas/PlatformKind'
        profiles:
          type: array
          items:
            type: string
      required:
      - kind
      - arch
      - profiles
    ProviderPath:
      description: The `{provider}` segment of an OAuth login route.
      type: object
      properties:
        provider:
          description: The login provider's name (e.g. `github`).
          type: string
      required:
      - provider
    PublicUserProfile:
      description: |-
        The world-readable subset of a user profile: only data deemed safe to expose
        to any authenticated caller.
      type: object
      properties:
        avatar_url:
          type:
          - string
          - 'null'
        github:
          description: The linked GitHub account, if any.
          anyOf:
          - $ref: '#/components/schemas/LinkedGitHub'
          - type: 'null'
        name:
          description: 'The user''s display name: freely chosen, not unique.'
          type: string
        user_id:
          type: string
          format: uuid
      required:
      - user_id
      - name
    RenderedAuditRow:
      description: |-
        One audit event, already rendered to a human-readable `message` for the
        requesting viewer (the switchboard resolves the per-event template and
        applies the viewer's visibility before sending it).
      type: object
      properties:
        actor_id:
          type: string
          format: uuid
        correlation_id:
          type:
          - string
          - 'null'
          format: uuid
        created_at:
          type: string
          format: date-time
        event_id:
          type: string
          format: uuid
        event_type:
          type: string
        message:
          type: string
      required:
      - event_id
      - event_type
      - created_at
      - actor_id
      - message
    Resources:
      description: |-
        The ceiling available to a single job on this host.

        Unsigned, so CEL sees these as `uint`: comparisons against a plain literal
        work (`host.resources.memory_mb >= 4096`), but arithmetic needs an unsigned
        literal (`host.resources.memory_mb / 1024u >= 8`).
      type: object
      properties:
        cpu_cores:
          type: integer
          format: uint32
          minimum: 0
        memory_mb:
          type: integer
          format: uint32
          minimum: 0
        storage_gb:
          type: integer
          format: uint32
          minimum: 0
      additionalProperties: false
      required:
      - cpu_cores
      - memory_mb
      - storage_gb
    RestartPolicy:
      description: |-
        How many times a job may be **automatically restarted** after it is dropped
        by its host, supplied with the job at enqueue (`POST /jobs`).

        Each automatic restart enqueues a successor that inherits one fewer; the
        count a running job still has left is reported back as [`RestartPolicyState`]
        on [`JobInfo`]. A `max_restarts` of `0` disables automatic restarts.
      type: object
      properties:
        max_restarts:
          description: Maximum number of automatic restarts to grant this job.
          type: integer
          format: uint32
          minimum: 0
      required:
      - max_restarts
    RestartPolicyState:
      description: |-
        The automatic-restart budget a job still has left, exposed as
        `restart_policy` on [`JobInfo`].

        A job enqueued with a [`RestartPolicy`] starts at its `max_restarts`; each
        automatic restart spends one, so this reports how many restarts the job (or
        the successor currently standing in for it) still has remaining.
      type: object
      properties:
        remaining_restarts:
          description: How many automatic restarts this job still has remaining.
          type: integer
          format: uint32
          minimum: 0
      required:
      - remaining_restarts
    Secret:
      description: |-
        A value that must not appear in logs.

        The wrapper is transparent on the wire — these types exist to be sent, and
        serialize as the bare inner value — and redacts only [`Debug`], which is
        what tracing and `{:?}` reach for. There is deliberately no `Display`,
        `Deref`, `AsRef` or `PartialEq`: every read is a visible
        [`expose`](Self::expose), and no comparison silently picks up a
        non-constant-time `==`.
      type: string
    SelfUserProfile:
      description: |-
        The owner's full view of their own profile: the public subset plus the
        private additions only the account holder may see.
      type: object
      properties:
        avatar_url:
          type:
          - string
          - 'null'
        emails:
          description: All email addresses on file for the account, one entry per address.
          type: array
          items:
            $ref: '#/components/schemas/UserEmail'
        github:
          description: The linked GitHub account, if any.
          anyOf:
          - $ref: '#/components/schemas/LinkedGitHub'
          - type: 'null'
        groups:
          description: Every group the user belongs to, including transitive memberships.
          type: array
          items:
            $ref: '#/components/schemas/GroupMembership'
        locked:
          description: Whether the account is locked (cannot log in or use existing sessions).
          type: boolean
        name:
          description: 'The user''s display name: freely chosen, not unique.'
          type: string
        user_id:
          type: string
          format: uuid
      required:
      - user_id
      - name
      - emails
      - groups
      - locked
    SessionInfo:
      description: |-
        One of the caller's active or historical sessions/API tokens. Never carries
        the secret token itself — only its metadata and provenance.
      type: object
      properties:
        comment:
          description: An optional human-supplied label for the token.
          type:
          - string
          - 'null'
        created_at:
          type: string
          format: date-time
        created_ip:
          description: The client IP the token was minted from, if recorded.
          type:
          - string
          - 'null'
        current:
          description: True for the token used to authenticate the current request.
          type: boolean
        expires_at:
          type: string
          format: date-time
        revoked:
          description: Set if the token has been revoked.
          anyOf:
          - $ref: '#/components/schemas/TokenRevocation'
          - type: 'null'
        token_id:
          type: string
          format: uuid
        user_agent:
          description: The user agent that requested the token, if recorded.
          type:
          - string
          - 'null'
      required:
      - token_id
      - created_at
      - expires_at
      - current
    SourceGrantPath:
      description: |-
        The `{digest}/sources/{source_id}/grants/{subject_id}/{permission}` segments
        of an image-source grant route.
      type: object
      properties:
        digest:
          description: The image's OCI manifest digest (`sha256:<hex>`).
          type: string
        permission:
          description: The permission being revoked (`use` or `manage`).
          type: string
        source_id:
          description: The source's unique identifier.
          type: string
          format: uuid
        subject_id:
          description: The subject (user or group) the grant applies to.
          type: string
          format: uuid
      required:
      - digest
      - source_id
      - subject_id
      - permission
    SourcePath:
      description: The `{digest}/sources/{source_id}` segments of an image-source route.
      type: object
      properties:
        digest:
          description: The image's OCI manifest digest (`sha256:<hex>`).
          type: string
        source_id:
          description: The source's unique identifier.
          type: string
          format: uuid
      required:
      - digest
      - source_id
    SpecVersionV1:
      description: The `spec_version` discriminant of a [`HostSpecV1`] document.
      type: string
      enum:
      - v1
    TaskExitStatus:
      description: |-
        The user workload's success/failure outcome, exposed as `task_exit_status`
        on [`JobInfo`]/[`JobSummary`].

        It is orthogonal to *why* the job terminated (see [`TerminationReason`]): the
        outcome reflects the workload's own result, reported by the host while the
        job runs and revisable until it ends. `pending` means the workload was still
        running when last reported; a null `task_exit_status` means no outcome was
        ever reported.
      oneOf:
      - description: The workload is running; its result is not yet determined.
        type: string
        const: pending
      - description: The workload completed successfully.
        type: string
        const: success
      - description: The workload failed.
        type: string
        const: failure
    TerminationReason:
      description: |-
        Why a job terminated.

        This records *why* a job stopped and is orthogonal to the `task_exit_status`
        (the success/failure of the user's workload) and to any `exit_message`.
      oneOf:
      - description: The job's workload terminated (e.g., QEMU VM shutdown).
        type: string
        const: workload_exited
      - description: |-
          The job requested its own termination (e.g., by requesting termination
          through the puppet).
        type: string
        const: workload_self_terminated
      - description: Externally terminated by a user.
        type: string
        const: user_terminated
      - description: Reclaimed after its lease expired, to place another job.
        type: string
        const: preempted
      - description: Timed out while still queued.
        type: string
        const: queue_timeout
      - description: Timed out while dispatched/executing.
        type: string
        const: execution_timeout
      - description: The job's image was bad or could not be fetched (user fault).
        type: string
        const: image_error
      - description: No host matched the job's tag configuration.
        type: string
        const: host_match_error
      - description: The host failed to start the job.
        type: string
        const: host_start_failure
      - description: The host's supervisor dropped the job (lost on reconnect).
        type: string
        const: host_dropped_job
      - description: The host was unreachable (its supervisor disconnected).
        type: string
        const: host_unreachable
      - description: Resuming a previously started job failed.
        type: string
        const: resume_failed
      - description: An unexpected internal failure.
        type: string
        const: internal_error
    TokenIdPath:
      description: The `{token_id}` segment of a token route.
      type: object
      properties:
        token_id:
          description: The token's unique identifier.
          type: string
          format: uuid
      required:
      - token_id
    TokenRevocation:
      description: When and why a token was revoked.
      type: object
      properties:
        reason:
          type: string
        revoked_at:
          type: string
          format: date-time
      required:
      - revoked_at
      - reason
    TosInfoResponse:
      description: |-
        Response body for `GET /auth/tos`: the Terms of Service text a frontend
        renders on the login-completion page, plus the version it corresponds to.
      type: object
      properties:
        text:
          description: The Terms of Service text to display.
          type: string
        version:
          description: The version this text corresponds to (the server's current ToS version).
          type: integer
          format: int32
      required:
      - version
      - text
    UpdateJobRequest:
      description: |-
        A patch to a job (`PATCH /jobs/{id}`). Only the fields listed here are
        mutable; a request carrying any other field is rejected. Omitting a field
        leaves it unchanged; sending an explicit `null` clears it.
      type: object
      properties:
        label:
          description: |-
            The job's display label: printable ASCII, bounded in length, not
            unique.
          type:
          - string
          - 'null'
        lease:
          description: A change to the job's lease. May be refused; see [`LeaseRejection`].
          anyOf:
          - $ref: '#/components/schemas/LeaseSpec'
          - type: 'null'
        lease_expiry_action:
          description: What should happen when the lease expires.
          anyOf:
          - $ref: '#/components/schemas/JobLeaseExpiryAction'
          - type: 'null'
      additionalProperties: false
    UpdateProfileRequest:
      description: |-
        A patch to the caller's own profile. Omitting a field leaves it unchanged.
        `name` cannot be cleared, only changed; an explicit `null` clears
        `avatar_url`.
      type: object
      properties:
        avatar_url:
          type:
          - string
          - 'null'
        name:
          description: |-
            The user's display name: non-empty, bounded in length, no control
            characters, not unique.
          type:
          - string
          - 'null'
    UserEmail:
      description: One email address on file for a user.
      type: object
      properties:
        email:
          type: string
        is_primary:
          description: Whether this is the user's primary address (set once at registration).
          type: boolean
        verified:
          description: Whether the provider has verified the address belongs to the user.
          type: boolean
      required:
      - email
      - verified
      - is_primary
    WhoAmIResponse:
      description: 'Response body for `/auth/whoami`: the identity of the authenticated subject.'
      type: object
      properties:
        name:
          description: 'The user''s display name: freely chosen, not unique.'
          type: string
        user_id:
          type: string
          format: uuid
      required:
      - user_id
      - name
tags:
- name: Authentication
  description: Interactive OAuth login, the login-completion step, and token introspection.
- name: Jobs
  description: Enqueue, inspect, and terminate jobs.
- name: Hosts
  description: Inspect hosts and their attached targets.
- name: Images
  description: Manage images, sources, sets, their generations, and grants.
- name: Users
  description: Profiles, sessions, and audit feeds.

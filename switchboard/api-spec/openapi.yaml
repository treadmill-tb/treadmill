openapi: 3.1.0
info:
  title: Treadmill Switchboard API
  version: 0.1.0
paths:
  /auth/{provider}/login:
    get:
      tags:
      - Authentication
      summary: Start an OAuth login
      description: |
        Begin an authorization-code flow with the given provider.

        This endpoint emits a 303 "See Other" redirect to the authentication
        provider's consent screen. A client may pass `?return_to=<URL>` (validated
        against a server-side allowlist) to have the callback redirect the browser
        following a successful token-exchange with the authenthenication provider.
        On redirect, the `(staged_id, staged_secret)` pair will be placed in request
        parameters of the `return_to` URL; without it the callback responds with
        JSON.
      operationId: startLogin
      parameters:
      - in: path
        name: provider
        description: The login provider's name (e.g. `github`).
        required: true
        schema:
          description: The login provider's name (e.g. `github`).
          type: string
        style: simple
      responses:
        '302':
          description: A redirect to the authentication provider's consent screen.
        '400':
          description: The declared return_to is not allowlisted.
        '404':
          description: No such provider is configured/enabled.
  /auth/{provider}/callback:
    get:
      tags:
      - Authentication
      summary: 'OAuth callback: finish a login'
      description: |
        The authentication provider's redirect target; not called directly.

        Performs a token-exchange with the authentication provider, and stages a new
        login. This endpoint does not mint a token directly; instead a client must
        complete the login with an additional request to `/auth/login/complete` by
        supplying the returned `(staged_id, staged_secret)` tuple. This tuple is
        either returned as JSON or, for a flow that declared a `return_to`
        parameter, via a 302 "See Other" redirect to an URL with those added as
        query parameters.

        A login may require additional information by the user (such as an explicit
        ToS accept). See the `/auth/login/complete` endpoint docs.
      operationId: finishLogin
      parameters:
      - in: path
        name: provider
        description: The login provider's name (e.g. `github`).
        required: true
        schema:
          description: The login provider's name (e.g. `github`).
          type: string
        style: simple
      - in: query
        name: code
        required: true
        schema:
          type: string
        style: form
      - in: query
        name: state
        required: true
        schema:
          type: string
        style: form
      responses:
        '200':
          description: The login is staged; complete it at POST /auth/login/complete.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LoginStagedResponse'
        '302':
          description: The login is staged; redirect to the original `redirect_to` target.
        '403':
          description: The identity was denied admission, or the account is locked.
  /auth/providers:
    get:
      tags:
      - Authentication
      summary: List the enabled login methods
      operationId: listAuthProviders
      responses:
        '200':
          description: |-
            Response body for the unauthenticated `/auth/providers` endpoint: which login
            methods a switchboard offers, so a frontend can render the right buttons
            without hardcoding provider knowledge.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthProvidersResponse'
  /auth/whoami:
    get:
      tags:
      - Authentication
      summary: Get the identity behind the presented token
      operationId: whoAmI
      responses:
        '401':
          description: 'Authentication failed: the bearer token is missing, malformed, expired, or revoked.'
        '403':
          description: The authenticated account is locked, or lacks permission for this resource.
        '200':
          description: 'Response body for `/auth/whoami`: the identity of the authenticated subject.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WhoAmIResponse'
      security:
      - token: []
  /auth/tos:
    get:
      tags:
      - Authentication
      summary: Get the current Terms of Service
      operationId: getTermsOfService
      responses:
        '200':
          description: |-
            Response body for `GET /auth/tos`: the Terms of Service text a frontend
            renders on the login-completion page, plus the version it corresponds to.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TosInfoResponse'
  /auth/login/complete:
    post:
      tags:
      - Authentication
      summary: Complete a staged login
      description: |
        Claim a staged login by providing the `(staged_id, staged_secret)` tuple
        provided by the callback response or redirect.

        Completing the login may require supplying additional values. If `required`
        includes `"tos"`, the `"tos_version"` field must be the current ToS
        version.

        Accepts the same fields form-encoded (for no-JS browser frontends).
      operationId: completeLogin
      requestBody:
        description: |-
          Request body for `POST /auth/login/complete`: finish a staged login. Sent as
          JSON or form-encoded data.
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginCompleteRequest'
        required: true
      responses:
        '200':
          description: The login completed; the response carries the session token.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LoginResponse'
        '403':
          description: The account is locked.
        '409':
          description: A required step is missing, or the echoed tos_version is not the one in force; the presented pair was consumed and the marker carries a fresh one to retry with.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LoginStagedResponse'
        '410':
          description: Unknown staged id, wrong secret, or the staged login expired or was already used.
  /jobs:
    get:
      tags:
      - Jobs
      summary: List jobs
      operationId: listJobs
      parameters:
      - in: query
        name: cursor
        description: Opaque keyset cursor from a previous response's `next_cursor`.
        schema:
          description: Opaque keyset cursor from a previous response's `next_cursor`.
          type: string
        style: form
      - in: query
        name: limit
        description: |-
          Maximum number of jobs per page. Omitted or out-of-range values fall
          back to the server's default and bounds.
        schema:
          description: |-
            Maximum number of jobs per page. Omitted or out-of-range values fall
            back to the server's default and bounds.
          type: integer
          format: uint32
          minimum: 0
        style: form
      responses:
        '401':
          description: 'Authentication failed: the bearer token is missing, malformed, expired, or revoked.'
        '403':
          description: The authenticated account is locked, or lacks permission for this resource.
        '200':
          description: |-
            Response body of `GET /jobs`: a page of jobs the caller can read, newest
            first.

            Pagination is **keyset** on `(queued_at, job_id)` descending: when
            `next_cursor` is non-null, pass it back as the `cursor` query parameter to
            fetch the next page; a null `next_cursor` means the last page. There is no
            total count.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/JobListResponse'
      security:
      - token: []
    post:
      tags:
      - Jobs
      summary: Enqueue a job
      operationId: enqueueJob
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/JobRequest'
        required: true
      responses:
        '401':
          description: 'Authentication failed: the bearer token is missing, malformed, expired, or revoked.'
        '403':
          description: The authenticated account is locked, or lacks permission for this resource.
        '400':
          description: Failed to parse the request body as JSON
          content:
            text/plain:
              schema:
                type: string
        '415':
          description: 'Expected request with `Content-Type: application/json`'
          content:
            text/plain:
              schema:
                type: string
        '422':
          description: Failed to deserialize the JSON body into the target type
          content:
            text/plain:
              schema:
                type: string
        '201':
          description: The job was enqueued; the response carries its id.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EnqueueJobResponse'
      security:
      - token: []
  /jobs/{id}/events:
    get:
      tags:
      - Jobs
      summary: List a job's audit events
      operationId: listJobEvents
      parameters:
      - in: path
        name: id
        description: The resource's unique identifier.
        required: true
        schema:
          description: The resource's unique identifier.
          type: string
          format: uuid
        style: simple
      - in: query
        name: cursor
        description: Opaque keyset cursor from a previous response's `next_cursor`.
        schema:
          description: Opaque keyset cursor from a previous response's `next_cursor`.
          type: string
        style: form
      - in: query
        name: limit
        description: |-
          Maximum number of events per page. Omitted or out-of-range values fall
          back to the server's default and bounds.
        schema:
          description: |-
            Maximum number of events per page. Omitted or out-of-range values fall
            back to the server's default and bounds.
          type: integer
          format: uint32
          minimum: 0
        style: form
      responses:
        '401':
          description: 'Authentication failed: the bearer token is missing, malformed, expired, or revoked.'
        '403':
          description: The authenticated account is locked, or lacks permission for this resource.
        '200':
          description: |-
            A page of rendered audit events for one entity, newest first.

            Paginated by keyset: when `next_cursor` is non-null, pass it back as the
            `cursor` query parameter to fetch the next (older) page; a null `next_cursor`
            means the last page.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuditFeedResponse'
      security:
      - token: []
  /jobs/{id}/watch:
    get:
      tags:
      - Jobs
      summary: Watch a job for changes
      operationId: watchJob
      parameters:
      - in: path
        name: id
        description: The resource's unique identifier.
        required: true
        schema:
          description: The resource's unique identifier.
          type: string
          format: uuid
        style: simple
      responses:
        '401':
          description: 'Authentication failed: the bearer token is missing, malformed, expired, or revoked.'
        '403':
          description: The authenticated account is locked, or lacks permission for this resource.
        '200':
          description: A `text/event-stream` of `change` events; re-GET the job on each.
      security:
      - token: []
  /jobs/{id}/nats-log-token:
    post:
      tags:
      - Jobs
      summary: Create a NATS log-streaming token for a job
      operationId: createJobNatsLogToken
      parameters:
      - in: path
        name: id
        description: The resource's unique identifier.
        required: true
        schema:
          description: The resource's unique identifier.
          type: string
          format: uuid
        style: simple
      responses:
        '401':
          description: 'Authentication failed: the bearer token is missing, malformed, expired, or revoked.'
        '403':
          description: The authenticated account is locked, or lacks permission for this resource.
        '200':
          description: |-
            Connection credentials for tailing/replaying a job's console logs over NATS,
            returned by `POST /jobs/{id}/nats-log-token`.

            The token is a short-lived **bearer** user JWT scoped to this job only: it
            may *subscribe* to the job's log subjects (`subject`) and its own inboxes
            (`inbox_prefix`), and *publish* to the slice of the JetStream API needed to
            run an ordered consumer against the job's stream (`stream`) — enough to
            replay stored history and then follow live. The client connects with the
            token string alone (no nkey seed) to whichever endpoint suits its transport:
            `websocket_url` for browsers, `nats_url` for native TCP clients. The same
            token authorizes either. The token only needs to be valid at connect time —
            an established NATS connection is not dropped when the JWT expires — so a
            client re-requests credentials when it next reconnects, after roughly
            `expires_in_secs`.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NatsLogStreamCredentials'
        '503':
          description: Log streaming is not enabled on this deployment.
      security:
      - token: []
  /jobs/{id}/nats-console-input-token:
    post:
      tags:
      - Jobs
      summary: Create a NATS console-input token for a job
      operationId: createJobNatsConsoleInputToken
      parameters:
      - in: path
        name: id
        description: The resource's unique identifier.
        required: true
        schema:
          description: The resource's unique identifier.
          type: string
          format: uuid
        style: simple
      responses:
        '401':
          description: 'Authentication failed: the bearer token is missing, malformed, expired, or revoked.'
        '403':
          description: The authenticated account is locked, or lacks permission for this resource.
        '200':
          description: |-
            Connection credentials for sending typed input to a job's serial console
            over NATS, returned by `POST /jobs/{id}/nats-console-input-token`.

            The token is a short-lived **bearer** user JWT that may *publish* to this
            job's console-input subject (`subject`) — nothing else. Every publish is
            recorded server-side, so treat the channel as monitored; feedback (echo)
            arrives through the separate log-streaming (read) channel. As with
            [`NatsLogStreamCredentials`], the token gates connect time only: an
            established connection outlives its expiry, and a client re-requests
            credentials when it next reconnects, after roughly `expires_in_secs`.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NatsConsoleInputCredentials'
        '503':
          description: Log streaming is not enabled on this deployment.
      security:
      - token: []
  /jobs/{id}/services/{service}/token:
    post:
      tags:
      - Jobs
      summary: Create a gateway token for a job's service
      operationId: createJobServiceToken
      parameters:
      - in: path
        name: id
        description: The job's unique identifier.
        required: true
        schema:
          description: The job's unique identifier.
          type: string
          format: uuid
        style: simple
      - in: path
        name: service
        description: The service's name within the job, as the job announced it.
        required: true
        schema:
          description: The service's name within the job, as the job announced it.
          type: string
        style: simple
      responses:
        '401':
          description: 'Authentication failed: the bearer token is missing, malformed, expired, or revoked.'
        '403':
          description: The authenticated account is locked, or lacks permission for this resource.
        '200':
          description: |-
            Access credentials for one of a job's announced services, returned by
            `POST /jobs/{id}/services/{service}/token`.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/JobServiceCredentials'
        '404':
          description: The job announces no service by that name.
        '409':
          description: The job has no network address recorded yet.
        '503':
          description: Job service gateways are not enabled on this deployment.
      security:
      - token: []
  /jobs/{id}:
    get:
      tags:
      - Jobs
      summary: Get a job
      operationId: getJob
      parameters:
      - in: path
        name: id
        description: The resource's unique identifier.
        required: true
        schema:
          description: The resource's unique identifier.
          type: string
          format: uuid
        style: simple
      responses:
        '401':
          description: 'Authentication failed: the bearer token is missing, malformed, expired, or revoked.'
        '403':
          description: The authenticated account is locked, or lacks permission for this resource.
        '200':
          description: |-
            The full server-side view of a single job, returned by `GET /jobs/{id}`.

            Covers the job's identity, ownership, lifecycle state, the spec it was
            enqueued with, and — once it has run — its placement and terminal outcome.
            Secret parameters are redacted (see [`JobParameterView`]).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/JobInfo'
      security:
      - token: []
    delete:
      tags:
      - Jobs
      summary: Terminate a job
      operationId: terminateJob
      parameters:
      - in: path
        name: id
        description: The resource's unique identifier.
        required: true
        schema:
          description: The resource's unique identifier.
          type: string
          format: uuid
        style: simple
      responses:
        '401':
          description: 'Authentication failed: the bearer token is missing, malformed, expired, or revoked.'
        '403':
          description: The authenticated account is locked, or lacks permission for this resource.
        '202':
          description: Termination was initiated.
        '204':
          description: The job was already finalized; nothing to do.
      security:
      - token: []
    patch:
      tags:
      - Jobs
      summary: Update a job
      operationId: updateJob
      parameters:
      - in: path
        name: id
        description: The resource's unique identifier.
        required: true
        schema:
          description: The resource's unique identifier.
          type: string
          format: uuid
        style: simple
      requestBody:
        description: |-
          A patch to a job (`PATCH /jobs/{id}`). Only the fields listed here are
          mutable; a request carrying any other field is rejected. Omitting a field
          leaves it unchanged; sending an explicit `null` clears it.
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateJobRequest'
        required: true
      responses:
        '401':
          description: 'Authentication failed: the bearer token is missing, malformed, expired, or revoked.'
        '403':
          description: The authenticated account is locked, or lacks permission for this resource.
        '400':
          description: Failed to parse the request body as JSON
          content:
            text/plain:
              schema:
                type: string
        '415':
          description: 'Expected request with `Content-Type: application/json`'
          content:
            text/plain:
              schema:
                type: string
        '422':
          description: Failed to deserialize the JSON body into the target type
          content:
            text/plain:
              schema:
                type: string
        '204':
          description: The job was updated.
        '409':
          description: The requested lease change was refused; nothing was applied.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LeaseRejection'
      security:
      - token: []
  /hosts:
    get:
      tags:
      - Hosts
      summary: List hosts
      description: Returns the complete set in a stable order; this route is not paginated.
      operationId: listHosts
      responses:
        '401':
          description: 'Authentication failed: the bearer token is missing, malformed, expired, or revoked.'
        '403':
          description: The authenticated account is locked, or lacks permission for this resource.
        '200':
          description: ''
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/HostListEntry'
      security:
      - token: []
    post:
      tags:
      - Hosts
      summary: Create a host
      description: Writes the host row and revision 1 of its spec in one transaction, and returns the supervisor credential. The credential is not retrievable afterwards.
      operationId: createHost
      requestBody:
        description: |-
          A new host (`POST /hosts`): the `hosts` row and revision 1 of its spec are
          written in one transaction, so a host is never in an undescribed state.
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/HostCreateRequest'
        required: true
      responses:
        '401':
          description: 'Authentication failed: the bearer token is missing, malformed, expired, or revoked.'
        '403':
          description: The caller is not a global admin.
        '400':
          description: Failed to parse the request body as JSON
          content:
            text/plain:
              schema:
                type: string
        '415':
          description: 'Expected request with `Content-Type: application/json`'
          content:
            text/plain:
              schema:
                type: string
        '422':
          description: Failed to deserialize the JSON body into the target type
          content:
            text/plain:
              schema:
                type: string
        '409':
          description: A host with the spec's `id` already exists.
      security:
      - token: []
  /hosts/{id}:
    get:
      tags:
      - Hosts
      summary: Get a host
      operationId: getHost
      parameters:
      - in: path
        name: id
        description: The resource's unique identifier.
        required: true
        schema:
          description: The resource's unique identifier.
          type: string
          format: uuid
        style: simple
      responses:
        '401':
          description: 'Authentication failed: the bearer token is missing, malformed, expired, or revoked.'
        '403':
          description: The caller lacks `read` on the host, or it does not exist.
        '200':
          description: |-
            A host as returned by `GET /hosts/{id}`: its operational state plus the
            whole admin-authored spec describing what it is.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HostInfo'
      security:
      - token: []
    patch:
      tags:
      - Hosts
      summary: Update a host
      operationId: updateHost
      parameters:
      - in: path
        name: id
        description: The resource's unique identifier.
        required: true
        schema:
          description: The resource's unique identifier.
          type: string
          format: uuid
        style: simple
      requestBody:
        description: |-
          A change to a host's operational state, carried by `PATCH /hosts/{id}`.

          Only the fields present are changed. Host *description* is not editable
          here: it lives in the host's spec, which is versioned separately.
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/HostUpdateRequest'
        required: true
      responses:
        '401':
          description: 'Authentication failed: the bearer token is missing, malformed, expired, or revoked.'
        '403':
          description: The caller lacks `manage` on the host.
        '400':
          description: Failed to parse the request body as JSON
          content:
            text/plain:
              schema:
                type: string
        '415':
          description: 'Expected request with `Content-Type: application/json`'
          content:
            text/plain:
              schema:
                type: string
        '422':
          description: Failed to deserialize the JSON body into the target type
          content:
            text/plain:
              schema:
                type: string
        '204':
          description: Applied, or the request changed nothing.
      security:
      - token: []
  /hosts/spec-schema:
    get:
      tags:
      - Hosts
      summary: Get the host spec schema
      description: The same artifact as the committed `host_spec.schema.json` snapshot.
      operationId: getHostSpecSchema
      responses:
        '200':
          description: ''
          content:
            application/json:
              schema: true
  /hosts/match:
    post:
      tags:
      - Hosts
      summary: Match hosts against a job's requirements
      description: Evaluated over the hosts the caller may start on, so a job that would never be placed says so before it is submitted.
      operationId: matchHosts
      requestBody:
        description: |-
          A dry run of a job's host requirements (`POST /hosts/match`).

          Answers the question a queued job cannot: *would this ever be placed?*
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/HostRequirementsRequest'
        required: true
      responses:
        '401':
          description: 'Authentication failed: the bearer token is missing, malformed, expired, or revoked.'
        '403':
          description: The caller lacks `use` on the named image set.
        '200':
          description: |-
            How a job's host requirements meet the fleet right now.

            Counts cover only the hosts the job's owner may `start` on, the same set
            the scheduler considers, so a caller cannot probe hosts it has no access to
            by submitting expressions and reading counts back.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HostRequirementsReport'
        '400':
          description: Failed to parse the request body as JSON
          content:
            text/plain:
              schema:
                type: string
        '415':
          description: 'Expected request with `Content-Type: application/json`'
          content:
            text/plain:
              schema:
                type: string
        '422':
          description: Failed to deserialize the JSON body into the target type
          content:
            text/plain:
              schema:
                type: string
      security:
      - token: []
  /hosts/{id}/spec:
    put:
      tags:
      - Hosts
      summary: Replace a host's spec
      description: Appends a revision; the history keeps every one, and the newest is the spec in force.
      operationId: putHostSpec
      parameters:
      - in: path
        name: id
        description: The resource's unique identifier.
        required: true
        schema:
          description: The resource's unique identifier.
          type: string
          format: uuid
        style: simple
      requestBody:
        description: A new revision of a host's spec (`PUT /hosts/{id}/spec`).
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/HostSpecUpdateRequest'
        required: true
      responses:
        '401':
          description: 'Authentication failed: the bearer token is missing, malformed, expired, or revoked.'
        '403':
          description: The caller lacks `manage` on the host.
        '400':
          description: Failed to parse the request body as JSON
          content:
            text/plain:
              schema:
                type: string
        '415':
          description: 'Expected request with `Content-Type: application/json`'
          content:
            text/plain:
              schema:
                type: string
        '422':
          description: Failed to deserialize the JSON body into the target type
          content:
            text/plain:
              schema:
                type: string
      security:
      - token: []
  /hosts/{id}/events:
    get:
      tags:
      - Hosts
      summary: List a host's audit events
      operationId: listHostEvents
      parameters:
      - in: path
        name: id
        description: The resource's unique identifier.
        required: true
        schema:
          description: The resource's unique identifier.
          type: string
          format: uuid
        style: simple
      - in: query
        name: cursor
        description: Opaque keyset cursor from a previous response's `next_cursor`.
        schema:
          description: Opaque keyset cursor from a previous response's `next_cursor`.
          type: string
        style: form
      - in: query
        name: limit
        description: |-

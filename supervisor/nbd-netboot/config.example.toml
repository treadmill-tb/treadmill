[base]
supervisor_id = "7d55ec6d-15e7-4b84-8c04-7c085fe60df4"
coord_connector = "ws_connector"

# IP address of the NBD netboot target, announced to the switchboard.
# job_address = "fd00::2"

# The switchboard API base URL, as this supervisor's jobs reach it.
job_switchboard_api_url = "https://switchboard.example"

[ws_connector]
# Placeholder: a supervisor token is 32 bytes, base64-encoded. Read one out of
# a file instead with `token_file = "..."`.
token = "AAECAwQFBgcICQoLDA0ODxAREhMUFRYXGBkaGxwdHh8="
switchboard_uri = "ws://localhost:8081"

# Local OCI store (a per-server Zot daemon). The supervisor uses the Zot
# daemon's fetched images directly as read-only qcow2 CoW backing layers.
[oci_store]
registry = "127.0.0.1:5000"
store_root = "/var/lib/zot"

# Console capture tuning, entirely local to this supervisor; see the qemu
# supervisor's example for what each field bounds. Optional — omit the whole
# section to use the built-in defaults.
#
# [log_streaming]
# chunk_bytes = 32768
# flush_interval = "100ms"
# job_log_level = "debug"

[nbd_netboot]
# Binaries the supervisor runs per job. If not specified, will look up on PATH.
# qemu_storage_daemon_binary = "qemu-storage-daemon"
# qemu_img_binary = "qemu-img"
# nbdfatftpd_binary = "nbdfatftpd"

state_dir = "./state"

daemon_api_listen_addr = "0.0.0.0:3859"

# Listen address for the `qemu-storage-daemon` subprocess (serving `root` and
# `boot` NBD exports).
nbd_server_listen_addr = "0.0.0.0:10809"

# Listen address for TFTP boot file system server (`nbdfatftpd`).
#
# Given port 69 is privileged, this requires running the supervisor with
# `CAP_NET_BIND_SERVICE`. Alternatively, you can lower
# `net.ipv4.ip_unprivileged_port_start` in its network namespace.
tftp_listen_addr = "0.0.0.0:69"

# Each host will have at most 32GB to work with. This should be sufficient to
# support most images, even heavy-weight toolchains (such as OpenTitan with
# Bazel and Vivado Lab tools)
working_disk_max_bytes = 34359738368

# Optional start/stop hooks. Start script runs after NBD and TFTP daemons are
# up; stop script before daemons are stopped. A set of `TML_*` environment
# variables are available, including `TML_NBD_SERVER_LISTEN_ADDR` and
# `TML_TFTP_LISTEN_ADDR`; read the source for details.
# start_script = "./power-on.sh"
# stop_script = "./power-off.sh"

# When to erase retired job state:
# [nbd_netboot.job_retention]
# grace_period = "24h"
# sweep_interval = "1h"
#
# Optionally, configure streaming for the host's serial console. Supports read
# and (for admins) write access:
# [nbd_netboot.serial_console]
# device = "/dev/ttyUSB0"
# baud_rate = 115200

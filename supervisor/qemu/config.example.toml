[base]
supervisor_id = "7d55ec6d-15e7-4b84-8c04-7c085fe60df4"
coord_connector = "ws_connector"

# IP address of the QEMU guest, announced to the switchboard.
# job_address = "fd00::2"

[ws_connector]
# Placeholder: a supervisor token is 32 bytes, base64-encoded. Read one out of
# a file instead with `token_file = "..."`.
token = "AAECAwQFBgcICQoLDA0ODxAREhMUFRYXGBkaGxwdHh8="
switchboard_uri = "ws://localhost:8081"

# Local OCI store (a per-server Zot daemon). The supervisor asks the daemon to
# make a dispatched manifest digest present, then opens the resulting blobs
# directly out of its storage root.
[oci_store]
registry = "127.0.0.1:5000"
store_root = "/var/lib/zot"

# Console capture tuning, entirely local to this supervisor. A captured frame
# is one NATS message, and the drain closes a frame when either bound is
# reached: `chunk_bytes` of accumulated output, or `flush_interval` since the
# frame's first byte. The interval is the delay a console viewer sees on a
# channel that trickles; shrinking it buys latency at the cost of
# proportionally more, smaller messages. `job_log_level` is the threshold at
# or above which this supervisor's own tracing events are forwarded to a job's
# log stream, independent of `RUST_LOG`, which governs only this supervisor's
# terminal. Every field is optional — omit the whole section to use the
# built-in defaults.
#
# [log_streaming]
# For example, to cut frames at 32 KiB or 100ms, whichever comes first, and to
# show a job's readers everything down to debug:
# chunk_bytes = 32768
# flush_interval = "100ms"
# job_log_level = "debug"

[qemu]
qemu_binary = "qemu-kvm"
qemu_img_binary = "qemu-img"

state_dir = "./state"

qemu_args = [
  # Misc:
  "-name",
  "tml-{job_id}",
  "-nographic",
  # Base machine configuration:
  "-machine",
  "q35",
  "-m",
  "4G",
  "-drive",
  "if=pflash,format=raw,readonly=on,file={job_workdir}/OVMF_CODE.fd",
  "-drive",
  "if=pflash,format=raw,file={job_workdir}/OVMF_VARS.fd",
  # Storage: the supervisor prepends the `-blockdev` nodes assembling the
  # image's backing chain, so the disk is attached by referencing the chain's
  # writable top node.
  "-device",
  "virtio-blk-pci,drive={disk_node}",
  # Network:
  "-netdev",
  "user,id=net0,hostfwd=tcp::2222-:22",
  "-device",
  "virtio-net-pci,id=nic0,netdev=net0",
  # Where the guest's puppet reaches this supervisor's control socket.
  # (10.0.2.2 is the host address in QEMU SLIRP networking; the port is
  # `tcp_control_socket_listen_addr`'s.)
  "-fw_cfg",
  "name=opt/org.tockos.treadmill.tcp-ctrl-socket,string=10.0.2.2:3859",
]

tcp_control_socket_listen_addr = "0.0.0.0:3859"

# Each VM will have at most 32GB to work with. This should be
# sufficient to support most images, even heavy-weight toolchains
# (such as OpenTitan with Bazel and Vivado Lab tools)
working_disk_max_bytes = 34359738368

start_script = "./nix_ovmf-vars_start_script.sh"
# Optional stop script (might run even if the start script didn't)
#stop_script = "./foobar"

# When the switchboard removes a job, its working directory
# (`<state_dir>/jobs/<job_id>`) is moved to `<state_dir>/retired`, from where
# the next sweep deletes it once it is older than `grace_period`. Working
# directories left behind by a crashed supervisor are retired the same way on
# startup. Both fields are optional; omit the section to use the built-in
# defaults.
#
# [qemu.job_retention]
# grace_period = "24h"
# sweep_interval = "1h"

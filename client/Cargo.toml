[package]
name = "treadmill-client"
version = "0.1.0"
edition.workspace = true

authors.workspace = true
categories = ["api-bindings", "development-tools::testing"]
description = "Client-side mechanics for the Treadmill Distributed Hardware Testbed"
homepage = "https://treadmill.dev"
keywords = ["ci", "testing", "testbed", "hardware", "embedded"]
license = "MIT OR Apache-2.0"
readme = "README.md"

[features]
default = ["profile", "ws"]
# The on-disk client configuration: XDG paths and the profile-nested TOML file,
# layered under `TML_*` environment variables. Carries `session`, and with it
# everything that needs to know which switchboard to talk to.
profile = ["dep:figment", "dep:xdg", "dep:futures-util"]
# The WebSocket bridge to a job's service, and the TLS to reach a gateway over.
ws = [
  "profile",
  "dep:tokio-tungstenite",
  "dep:rustls",
  "dep:rustls-native-certs",
  "dep:futures-util",
  "tokio/io-util",
  "tokio/net",
]

[dependencies]
# Needs `version` + `path` (rather than `workspace = true`) for `cargo publish`
# to be able to resolve treadmill-rs by its published version. Local builds
# continue to use the path dependency.
treadmill-rs = { version = "0.3.0", path = "../treadmill-rs", features = [
  "client",
] }

anyhow = { workspace = true }
base64 = { workspace = true }
chrono = { workspace = true, features = ["serde"] }
figment = { version = "0.10.19", features = ["toml", "env"], optional = true }
futures-util = { workspace = true, optional = true }
rustls = { version = "0.23.46", default-features = false, features = [
  "ring",
  "std",
], optional = true }
rustls-native-certs = { version = "0.8.5", optional = true }
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
tokio = { workspace = true }
tokio-tungstenite = { version = "0.30", features = [
  "rustls-tls-native-roots",
], optional = true }
uuid = { workspace = true, features = ["serde"] }
xdg = { version = "3.0.0", optional = true }

[lints]
workspace = true

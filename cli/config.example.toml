# tml configuration.
#
# Each top-level object is a profile (can be selected with --profile).
#
# Every config key can also be set as TML_<KEY>. Environment variables take
# precedence over config values.

[default]
switchboard = "https://swb.treadmill.dev"

# Default SSH username when connecting to a job.
# user = "tml"

# Token for non-interactive login. Prefer using the TML_TOKEN env var.
# token = "..."

# Skip TLS certificate verification.
# insecure_tls = false

# Domains used in the `tml ssh` integration.
#
# This enables support for `ssh tml@<job-id>.job.treadmill.dev`, after running
# `tml ssh setup`. A hostname can be a specific gateway
# (`<job-id>.us-east-1.user-gw.treadmill.dev`, one sub-domain under the
# `ssh_domains` specified here). Otherwise, uses the job's primary gateway.
ssh_domains = ["job.treadmill.dev", "user-gw.treadmill.dev"]

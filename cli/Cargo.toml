[package]
name = "treadmill-cli"
version = "0.3.1"
edition.workspace = true

authors.workspace = true
categories = ["command-line-utilities", "development-tools::testing"]
description = "CLI Client for the Treadmill Distributed Hardware Testbed"
homepage = "https://treadmill.dev"
keywords = ["ci", "testing", "testbed", "hardware", "embedded"]
license = "MIT OR Apache-2.0"
readme = "README.md"

[[bin]]
name = "tml"
path = "src/main.rs"

[features]
default = ["user", "daemon"]
user = [
  "dep:chrono",
  "dep:crossterm",
  "dep:figment",
  "dep:futures-util",
  "dep:rustls",
  "dep:rustls-native-certs",
  "dep:tokio-tungstenite",
  "dep:toml",
  "dep:xdg",
  "tokio/process",
]
daemon = [
  "dep:chrono",
  "dep:crossterm",
  "dep:ed25519-dalek",
  "dep:futures-util",
  "dep:log",
  "dep:sd-notify",
  "dep:simplelog",
  "dep:zbus",
  "tokio/fs",
  "tokio/process",
  "tokio/time",
]

[dependencies]
# Needs `version` + `path` (rather than `workspace = true`) for `cargo publish`
# to be able to resolve treadmill-rs by its published version. Local builds
# continue to use the path dependency.
treadmill-rs = { version = "0.3.0", path = "../treadmill-rs", features = [
  "client",
] }

anstream = "1.0.0"
anstyle = "1.0.0"
anyhow = { workspace = true }
base64 = { workspace = true }
chrono = { workspace = true, optional = true }
clap = { workspace = true, features = ["derive", "env"] }
crossterm = { version = "0.29.0", features = ["event-stream"], optional = true }
ed25519-dalek = { workspace = true, features = ["pem"], optional = true }
figment = { version = "0.10.19", features = ["toml", "env"], optional = true }
futures-util = { workspace = true, optional = true }
log = { workspace = true, optional = true }
rustls = { version = "0.23.44", default-features = false, features = [
  "ring",
  "std",
], optional = true }
rustls-native-certs = { version = "0.8.4", optional = true }
sd-notify = { workspace = true, optional = true }
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
simplelog = { version = "0.12.1", optional = true }
tokio = { workspace = true, features = [
  "rt-multi-thread",
  "macros",
  "io-std",
  "io-util",
  "net",
  "signal",
] }
tokio-tungstenite = { version = "0.30", features = [
  "rustls-tls-native-roots",
], optional = true }
toml = { workspace = true, optional = true }
uuid = { workspace = true, features = ["serde"] }
xdg = { version = "3.0.0", optional = true }
zbus = { version = "6.0.0", optional = true }

[dev-dependencies]
insta = { version = "1.49.0", features = ["json"] }

[lints]
workspace = true
